<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>King of Villagers</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blood: #8a1f1f; --blood-bright:#c73e3e; --amber:#d68a3c; --bone:#e8ddc8;
    --ink:#0b0a09; --panel:rgba(10,8,7,.88);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; font-family:'Cinzel',serif; color:var(--bone); }
  canvas{ display:block; }
  #crosshair{ position:absolute; top:50%; left:50%; width:6px; height:6px; margin:-3px 0 0 -3px; border-radius:50%; background:rgba(232,221,200,.85); box-shadow:0 0 6px rgba(0,0,0,.8); pointer-events:none; }
  #hud{ position:absolute; inset:0; pointer-events:none; display:none; font-family:'Cinzel',serif; }
  #bars{ position:absolute; bottom:22px; left:26px; width:280px; }
  .bar-track{ width:100%; height:14px; border:1px solid rgba(232,221,200,.35); border-radius:3px; background:rgba(0,0,0,.5); overflow:hidden; margin-bottom:6px; }
  .bar-fill{ height:100%; transition:width .15s; }
  #healthFill{ background:linear-gradient(90deg,#5a0f0f,var(--blood-bright)); }
  #armorFill{ background:linear-gradient(90deg,#3a4a6e,#7ea0d6); }
  #staminaFill{ background:linear-gradient(90deg,#4a3a10,#d6b23c); height:8px; }
  #armorTrack, #armorLabel{ display:none; }
  .barLabel{ font-size:10px; letter-spacing:2px; opacity:.75; margin-bottom:3px; text-transform:uppercase; }
  #enemyCount{ position:absolute; bottom:22px; right:26px; text-align:right; font-size:13px; letter-spacing:1px; }
  #enemyCount b{ color:var(--blood-bright); font-size:16px; }
  #armyCount{ position:absolute; bottom:88px; right:26px; text-align:right; font-size:13px; letter-spacing:1px; }
  #armyCount b{ color:#7ea0d6; font-size:16px; }
  #stanceBox{ position:absolute; top:22px; right:26px; text-align:right; font-size:11px; letter-spacing:2px; opacity:.9; }
  #stanceBox b{ display:block; font-family:'Cinzel Decorative',serif; color:var(--amber); font-size:16px; letter-spacing:3px; margin-top:2px; }
  #goldPill{ position:absolute; top:22px; left:26px; font-size:14px; background:rgba(0,0,0,.4); border:1px solid rgba(214,138,60,.4); border-radius:20px; padding:6px 16px; }
  #banner{ position:absolute; top:36%; left:50%; transform:translate(-50%,-50%); font-family:'Cinzel Decorative',serif; font-size:26px; letter-spacing:4px; color:var(--amber); text-shadow:0 0 16px rgba(214,138,60,.6), 0 2px 0 #000; opacity:0; text-align:center; text-transform:uppercase; pointer-events:none; transition:opacity .25s; }
  #bossBar{ position:absolute; top:78px; left:50%; transform:translateX(-50%); width:440px; max-width:82vw; text-align:center; }
  #bossBar .bossName{ font-family:'Cinzel Decorative',serif; font-size:16px; color:var(--blood-bright); letter-spacing:4px; text-transform:uppercase; margin-bottom:5px; text-shadow:0 0 12px rgba(199,62,62,.6), 0 2px 0 #000; }
  #bossBar .bar-track{ height:18px; border-color:rgba(199,62,62,.5); }
  #bossFill{ background:linear-gradient(90deg,#4a0808,#ff2e2e); }
  #drawHint{ position:absolute; bottom:120px; left:50%; transform:translateX(-50%); font-size:12px; letter-spacing:2px; opacity:.75; text-align:center; }

  #overlay{ position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:flex-start; overflow-y:auto; padding:50px 20px 60px; text-align:center;
    background:radial-gradient(ellipse at center, rgba(30,18,14,.92) 0%, rgba(6,4,3,.97) 70%); }
  #overlay h1{ font-family:'Cinzel Decorative',serif; font-size:46px; letter-spacing:6px; color:var(--amber); text-shadow:0 0 24px rgba(214,138,60,.5), 0 3px 0 #000; margin:0 0 6px; }
  #overlay .sub{ font-size:14px; letter-spacing:3px; opacity:.8; margin-bottom:22px; text-transform:uppercase; }
  #overlay .statusrow{ display:flex; gap:22px; flex-wrap:wrap; justify-content:center; font-size:13px; margin-bottom:26px; opacity:.9; }
  #overlay .statusrow b{ color:var(--amber); }
  .cardgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px; max-width:980px; width:100%; margin-bottom:30px; }
  .vcard{ background:var(--panel); border:1px solid rgba(214,138,60,.28); border-radius:8px; padding:18px 16px; text-align:left; cursor:pointer; transition:border-color .2s, transform .15s; position:relative; }
  .vcard:hover{ border-color:var(--amber); transform:translateY(-2px); }
  .vcard.locked{ opacity:.4; cursor:not-allowed; }
  .vcard.locked:hover{ transform:none; border-color:rgba(214,138,60,.28); }
  .vcard.cleared::after{ content:'✓ WON'; position:absolute; top:14px; right:14px; font-size:10px; letter-spacing:2px; color:#7ec98a; }
  .vcard h3{ margin:0 0 4px; font-size:17px; font-family:'Cinzel Decorative',serif; letter-spacing:1px; color:var(--bone); }
  .vcard .diff{ font-size:10px; letter-spacing:2px; text-transform:uppercase; margin-bottom:8px; display:inline-block; padding:2px 8px; border-radius:10px; }
  .diff-Easy{ background:rgba(120,180,120,.2); color:#8fd08f; }
  .diff-Medium{ background:rgba(190,170,90,.2); color:#e0c86a; }
  .diff-Hard{ background:rgba(214,120,60,.2); color:#e89a5c; }
  .diff-Brutal{ background:rgba(199,62,62,.25); color:#e07a7a; }
  .diff-Nightmare{ background:rgba(120,30,140,.28); color:#c98adf; }
  .vcard p{ font-size:12px; opacity:.75; line-height:1.5; margin:0 0 8px; }
  .vcard .mix{ font-size:10.5px; opacity:.6; line-height:1.5; }
  .sectionLabel{ font-family:'Cinzel Decorative',serif; font-size:16px; letter-spacing:2px; color:var(--amber); margin:26px 0 12px; text-transform:uppercase; }
  .shopgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; max-width:980px; width:100%; margin-bottom:6px; }
  .shopcard{ background:var(--panel); border:1px solid rgba(154,163,171,.25); border-radius:8px; padding:14px; text-align:left; }
  .shopcard.owned{ border-color:rgba(126,201,138,.5); }
  .shopcard.equipped{ border-color:var(--amber); box-shadow:0 0 14px rgba(214,138,60,.25); }
  .shopcard h4{ margin:0 0 4px; font-size:14.5px; font-family:'Cinzel Decorative',serif; }
  .shopcard .stat{ font-size:11px; opacity:.75; margin-bottom:8px; line-height:1.5; }
  .shopcard button{ font-family:'Cinzel',serif; font-weight:700; font-size:11px; letter-spacing:1px; padding:7px 12px; border-radius:4px; cursor:pointer; border:1px solid var(--amber); background:rgba(214,138,60,.22); color:var(--bone); margin-right:6px; margin-top:4px; }
  .shopcard button:disabled{ opacity:.35; cursor:not-allowed; }
  .shopcard button.small{ padding:5px 9px; font-size:10px; }
  .bigbtn{ font-family:'Cinzel',serif; font-weight:700; letter-spacing:2px; text-transform:uppercase; font-size:15px; padding:13px 34px; border-radius:5px; cursor:pointer; border:1px solid var(--amber); background:linear-gradient(180deg, rgba(214,138,60,.32), rgba(120,60,20,.32)); color:var(--bone); box-shadow:0 4px 14px rgba(0,0,0,.4); }
  .bigbtn:hover{ background:linear-gradient(180deg, rgba(214,138,60,.5), rgba(120,60,20,.5)); }
  .controls{ font-size:11px; opacity:.65; line-height:1.7; max-width:560px; margin:0 auto 18px; }
  #startScreen{ display:flex; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="crosshair"></div>
<div id="hud">
  <div id="goldPill">⛁ <b id="goldCount">0</b> gold &nbsp;|&nbsp; 🗡 <span id="swordPill">Iron Broadsword</span></div>
  <div id="banner"></div>
  <div id="bossBar" style="display:none">
    <div class="bossName">Osric Vane</div>
    <div class="bar-track"><div class="bar-fill" id="bossFill" style="width:100%"></div></div>
  </div>
  <div id="stanceBox">Order<b id="stanceLabel">HOLD</b></div>
  <div id="bars">
    <div class="barLabel" id="armorLabel">Armor</div>
    <div class="bar-track" id="armorTrack"><div class="bar-fill" id="armorFill" style="width:100%"></div></div>
    <div class="barLabel">Health</div>
    <div class="bar-track"><div class="bar-fill" id="healthFill" style="width:100%"></div></div>
    <div class="barLabel">Stamina</div>
    <div class="bar-track"><div class="bar-fill" id="staminaFill" style="width:100%"></div></div>
  </div>
  <div id="armyCount">Your army<br><b id="armyLeft">0</b></div>
  <div id="enemyCount">Rebels remaining<br><b id="enemyLeft">0</b><br><span style="opacity:.6">I advance · O hold · P protect · Q retreat</span></div>
</div>
<div id="overlay"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  'use strict';

  // ================= CONSTANTS =================
  const MELEE_RANGE = 2.4;
  const PLAYER_RADIUS = 0.42;
  const P_MAX_HEALTH = 100, P_MAX_STAMINA = 100;

  const SWORDS = [
    { id:'iron',   name:'Iron Broadsword',      cost:0,    dmg:[16,24], range:2.5, arc:50, cooldown:0.55, bladeColor:0x9a8f7c, glow:0 },
    { id:'steel',  name:'Steel Longsword',      cost:155,  dmg:[23,33], range:2.6, arc:52, cooldown:0.50, bladeColor:0xb8c4cc, glow:0 },
    { id:'silver', name:'Silver-Chased Blade',  cost:360,  dmg:[31,45], range:2.7, arc:55, cooldown:0.46, bladeColor:0xdfe4e6, glow:0.15 },
    { id:'crown',  name:'The Crownblade',       cost:750,  dmg:[44,62], range:2.9, arc:58, cooldown:0.40, bladeColor:0xffd77a, glow:0.5 },
  ];
  const ARMORS = [
    { id:'gambeson',   name:'Padded Gambeson',   cost:85,   armor:35 },
    { id:'chain',      name:'Chainmail Hauberk', cost:205,  armor:75 },
    { id:'plate',      name:'Plate Cuirass',     cost:420,  armor:140 },
    { id:'kingsguard', name:'Kingsguard Plate',  cost:810,  armor:220 },
  ];
  const UNIT_TYPES = {
    guard:     { label:'Guard',     cost:42, hp:85,  dmg:[11,17], speed:6.0, range:MELEE_RANGE, ranged:false, atkCooldown:0.90 },
    spearman:  { label:'Spearman',  cost:60, hp:100, dmg:[14,20], speed:5.8, range:3.0,          ranged:false, atkCooldown:0.85 },
    archer:    { label:'Archer',    cost:72, hp:60,  dmg:[10,15], speed:6.2, range:15,           ranged:true,  atkCooldown:1.30 },
    berserker: { label:'Berserker', cost:100, hp:145, dmg:[19,28], speed:6.6, range:2.6,         ranged:false, atkCooldown:1.05 },
  };
  const REBEL_TYPES = {
    pitchfork:  { label:'Pitchfork Rebel', hp:85,  dmg:[10,16], speed:5.7, range:2.5, ranged:false, atkCooldown:1.02, alertRadius:14 },
    torch:      { label:'Torchbearer',     hp:90,  dmg:[11,17], speed:5.6, range:2.4, ranged:false, atkCooldown:1.10, alertRadius:14 },
    rebelspear: { label:'Rebel Spearman',  hp:115, dmg:[15,22], speed:5.9, range:3.1, ranged:false, atkCooldown:0.95, alertRadius:14 },
    rebelbow:   { label:'Rebel Archer',    hp:72,  dmg:[13,20], speed:5.9, range:17,  ranged:true,  atkCooldown:1.35, alertRadius:20 },
    fanatic:    { label:'Fanatic',         hp:180, dmg:[20,30], speed:6.9, range:2.7, ranged:false, atkCooldown:1.05, alertRadius:15 },
  };
  const CONSPIRATOR_HP = 1300, CONSPIRATOR_DMG = [42,62];
  const CONSPIRATOR_NAME = 'Osric Vane';

  function mix(...groups){ return [].concat(...groups.map(([type,n])=>Array(n).fill(type))); }

  const BATTLES = [
    { name:'The Supply Raid', difficulty:'Easy', powerMult:0.95, deployCap:5, radius:32,
      fog:0x161009, ambient:0x394a5c, sun:0xffb066, hasBarricade:false,
      enemyMix: mix(['pitchfork',4],['torch',3]),
      desc:'A rebel cart is hauling stolen grain and steel out of the city. Cut it off before it reaches the uprising.' },
    { name:'Battle on the Streets', difficulty:'Easy', powerMult:1.06, deployCap:7, radius:36,
      fog:0x141210, ambient:0x3a3a44, sun:0xc9b199, hasBarricade:true,
      enemyMix: mix(['pitchfork',6],['torch',5]),
      desc:'The rebels have thrown a barricade across the market road. Break it, and break them.' },
    { name:'The Tavern Uprising', difficulty:'Medium', powerMult:1.15, deployCap:9, radius:38,
      fog:0x1a140e, ambient:0x4a3a30, sun:0xe8a860, hasBarricade:false,
      enemyMix: mix(['pitchfork',7],['torch',6]),
      desc:"A tavern full of armed rebels is toasting the king's downfall. Cut the celebration short." },
    { name:'The Market Uprising', difficulty:'Medium', powerMult:1.24, deployCap:10, radius:42,
      fog:0x141a12, ambient:0x3a4a3e, sun:0xb8cf8a, hasBarricade:false,
      enemyMix: mix(['pitchfork',7],['torch',6],['rebelspear',5]),
      desc:'A mob has seized the market square and armed itself with spears looted from your own garrisons.' },
    { name:'The Bridge Stand', difficulty:'Medium', powerMult:1.33, deployCap:13, radius:46,
      fog:0x12141a, ambient:0x40465c, sun:0xb9c4ff, hasBarricade:false, hasBridge:true,
      enemyMix: mix(['pitchfork',7],['torch',6],['rebelspear',6],['rebelbow',6]),
      desc:'Rebels hold the river bridge, and now they loose looted arrows from the far bank. Cross it regardless.' },
    { name:'The Harbor Skirmish', difficulty:'Hard', powerMult:1.43, deployCap:15, radius:49,
      fog:0x0e161a, ambient:0x2e4050, sun:0x8ab6d6, hasBarricade:false, hasHarbor:true,
      enemyMix: mix(['pitchfork',9],['torch',7],['rebelspear',6],['rebelbow',5]),
      desc:'Rebel skiffs land more pitchforks and stolen bows at the docks by the hour. Stop the landings.' },
    { name:'The Granary Siege', difficulty:'Hard', powerMult:1.53, deployCap:17, radius:52,
      fog:0x1a0b0b, ambient:0x3a2a30, sun:0xff8a5c, hasBarricade:true,
      enemyMix: mix(['pitchfork',9],['torch',7],['rebelspear',7],['rebelbow',6],['fanatic',4]),
      desc:'The rebellion has dug in around the royal granary. Fanatics among them fight like they have nothing left to lose.' },
    { name:'The Prison Break', difficulty:'Hard', powerMult:1.65, deployCap:19, radius:55,
      fog:0x100a14, ambient:0x2a1e34, sun:0x9a6ad6, hasBarricade:false, hasPrison:true,
      enemyMix: mix(['pitchfork',9],['torch',8],['rebelspear',8],['rebelbow',6],['fanatic',3]),
      desc:'The rebels are storming the city gaol to free their captured kin. Hold the line.' },
    { name:'The Night Assault', difficulty:'Brutal', powerMult:1.78, deployCap:21, radius:58,
      fog:0x0a0810, ambient:0x1e1e30, sun:0x5566aa, hasBarricade:false,
      enemyMix: mix(['pitchfork',11],['torch',9],['rebelspear',9],['rebelbow',8],['fanatic',6]),
      desc:'Under cover of darkness, the bulk of the conspirator\'s forces mass for one last strike at the palace.' },
    { name:'The Palace Gate', difficulty:'Brutal', powerMult:1.92, deployCap:23, radius:61,
      fog:0x0c0810, ambient:0x241830, sun:0x7a4a8a, hasBarricade:true,
      enemyMix: mix(['pitchfork',12],['torch',10],['rebelspear',9],['rebelbow',8],['fanatic',6]),
      desc:"The conspirator's vanguard has reached the palace gates themselves. This is the last line before the throne." },
    { name:"The Conspirator's Stand", difficulty:'Nightmare', powerMult:2.10, deployCap:26, radius:66,
      fog:0x090509, ambient:0x1c1020, sun:0x9c3050, hasBarricade:true, isFinal:true,
      enemyMix: mix(['pitchfork',12],['torch',10],['rebelspear',10],['rebelbow',8],['fanatic',6]),
      desc:`${CONSPIRATOR_NAME} makes his final stand at the palace gates, with every rebel he has left. End the rebellion here.` },
  ];
  const battlesCleared = BATTLES.map(()=>false);

  // ================= STATE =================
  let gold = 0;
  const ownedSwords = new Set(['iron']);
  let equippedSwordId = 'iron';
  let currentSword = SWORDS[0];
  const ownedArmor = new Set();
  let equippedArmorId = null;
  let currentArmor = null;
  const ownedUnits = { guard:5, spearman:0, archer:0, berserker:0 };

  let phase = 'select'; // select | briefing | battle | camp | paused | finale
  let currentCfg = null, pendingBattleIdx = 0;
  let bossSpawned = false;

  const P = { health:P_MAX_HEALTH, maxHealth:P_MAX_HEALTH, stamina:P_MAX_STAMINA, maxStamina:P_MAX_STAMINA,
    armor:0, maxArmor:0, kills:0, dead:false, velocity:new THREE.Vector3() };

  let allyStance = 'hold'; // advance | hold | protect

  // ================= THREE SETUP =================
  const canvas = document.getElementById('canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1,1.25));
  renderer.shadowMap.enabled = false;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 400);
  const player = new THREE.Object3D();
  player.add(camera);
  camera.position.set(0, 1.68, 0);
  scene.add(player);

  let hemi, sunLight, ground, groundMat;
  function resize(){
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  }
  window.addEventListener('resize', resize);
  resize();

  const clock = new THREE.Clock();

  // sword group, attached to camera
  const swordGroup = new THREE.Group();
  camera.add(swordGroup);
  function buildSwordMesh(s){
    swordGroup.clear();
    const bladeMat = new THREE.MeshStandardMaterial({ color:s.bladeColor, metalness:.6, roughness:.3,
      emissive: s.glow ? s.bladeColor : 0x000000, emissiveIntensity: s.glow||0 });
    const hiltMat = new THREE.MeshStandardMaterial({ color:0x3a2a18, roughness:.8 });
    const goldMat = new THREE.MeshStandardMaterial({ color:0xd6a53c, metalness:.7, roughness:.35 });
    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.85, 0.16), bladeMat);
    blade.position.set(0, 0.55, 0);
    swordGroup.add(blade);
    const guardBar = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.06, 0.06), goldMat);
    guardBar.position.set(0, 0.11, 0);
    swordGroup.add(guardBar);
    const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,0.24,6), hiltMat);
    grip.position.set(0, -0.05, 0);
    swordGroup.add(grip);
    const pommel = new THREE.Mesh(new THREE.SphereGeometry(0.055,7,6), goldMat);
    pommel.position.set(0, -0.19, 0);
    swordGroup.add(pommel);
    swordGroup.position.set(0.32, -0.32, -0.55);
    swordGroup.rotation.set(0.25, -0.15, -0.35);
  }
  buildSwordMesh(SWORDS[0]);

  // ================= MESH BUILDERS =================
  function bodyParts(g, palette, scaleMult){
    scaleMult = scaleMult || 1;
    const skinMat = new THREE.MeshStandardMaterial({ color:0xd9b38c, roughness:.85 });
    const bodyMat = new THREE.MeshStandardMaterial({ color:palette.body, roughness:.85 });
    const legMat = new THREE.MeshStandardMaterial({ color:palette.legs||0x2e2418, roughness:.85 });
    const legL = new THREE.Mesh(new THREE.BoxGeometry(.19,.68,.19), legMat);
    legL.position.set(-.15,.34,0); g.add(legL);
    const legR = legL.clone(); legR.position.x = .15; g.add(legR);
    const torso = new THREE.Mesh(new THREE.BoxGeometry(.6,1.0,.38), bodyMat);
    torso.position.set(0,1.0,0); g.add(torso);
    const armGeo = new THREE.BoxGeometry(.16,.66,.16);
    const armL = new THREE.Mesh(armGeo, skinMat); armL.position.set(-.4,1.0,0); g.add(armL);
    const armR = new THREE.Mesh(armGeo, skinMat); armR.position.set(.4,1.0,0); g.add(armR);
    const head = new THREE.Mesh(new THREE.BoxGeometry(.4,.4,.4), skinMat);
    head.position.set(0,1.72,0); g.add(head);
    if(palette.cape){
      const cape = new THREE.Mesh(new THREE.BoxGeometry(.5,.9,.08), new THREE.MeshStandardMaterial({color:palette.cape, roughness:.9}));
      cape.position.set(0,1.0,.22); g.add(cape);
    }
    if(palette.helm){
      const helm = new THREE.Mesh(new THREE.SphereGeometry(.24,8,6,0,Math.PI*2,0,Math.PI*.62), new THREE.MeshStandardMaterial({color:palette.helm, metalness:.5, roughness:.4}));
      helm.position.set(0,1.86,0); g.add(helm);
    }
    if(palette.trim){
      const trim = new THREE.Mesh(new THREE.BoxGeometry(.5,.08,.42), new THREE.MeshStandardMaterial({color:palette.trim, metalness:.5, roughness:.4}));
      trim.position.set(0,1.4,0); g.add(trim);
    }
    g.scale.set(scaleMult,scaleMult,scaleMult);
    g.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
    return { armR };
  }

  function makeSoldier(type){
    const g = new THREE.Group();
    const palette = {
      guard:     { body:0x2a3a5c, cape:0x18223c, trim:0xd6a53c },
      spearman:  { body:0x2a4a52, cape:0x142a2c, trim:0xd6a53c },
      archer:    { body:0x2a5c3a, cape:null,      trim:0xd6a53c },
      berserker: { body:0x4a2a5c, cape:0x261338,  trim:0xd6a53c },
    }[type];
    const { armR } = bodyParts(g, palette, type==='berserker'?1.12:1);
    if(type==='spearman'){
      const poleGroup = new THREE.Group();
      const shaft = new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,1.35,5), new THREE.MeshStandardMaterial({color:0x4a3320}));
      shaft.position.y = 0.675; poleGroup.add(shaft);
      const tip = new THREE.Mesh(new THREE.ConeGeometry(.06,.22,5), new THREE.MeshStandardMaterial({color:0xc7cdd2, metalness:.65}));

      poleGroup.position.set(.55,1.15,0);

    } else if(type==='archer'){

  function makeRebel(type){

      rebelspear:  { body:0x4a3a3a, cape:0x241414,  legs:0x2a2020 },

      fanatic:     { body:0x5a1f1f, cape:0x2a0e0e,  legs:0x2a1414 },
      conspirator: { body:0x1a1030, cape:0x120a24,  legs:0x120a1c, helm:0x8a6a2a },

      });
      poleGroup.position.set(.52,1.05,0);
      poleGroup.rotation.z = Math.PI/2.3;

      shaft.position.y = 0.5; poleGroup.add(shaft);
      const flame = new THREE.Mesh(new THREE.ConeGeometry(.13,.32,6), new THREE.MeshStandardMaterial({color:0xff7a1f, emissive:0xff5500, emissiveIntensity:1.1, transparent:true, opacity:.92}));
      flame.position.y = 1.0+0.16; poleGroup.add(flame);
      poleGroup.position.set(.48,1.05,0);
      poleGroup.rotation.z = Math.PI/2.3;
      g.add(poleGroup);
    } else if(type==='rebelspear'){
      const poleGroup = new THREE.Group();
      const shaft = new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,1.3,5), new THREE.MeshStandardMaterial({color:0x4a3320}));
      shaft.position.y = 0.65; poleGroup.add(shaft);
      const tip = new THREE.Mesh(new THREE.ConeGeometry(.06,.2,5), new THREE.MeshStandardMaterial({color:0xb9bec4, metalness:.6}));
      tip.position.y = 1.3+0.1; poleGroup.add(tip);
      poleGroup.position.set(.55,1.1,0);
      poleGroup.rotation.z = Math.PI/2.3;
      g.add(poleGroup);
    } else if(type==='rebelbow'){
      const bowArc = new THREE.Mesh(new THREE.TorusGeometry(.3,.02,6,10,Math.PI*1.2), new THREE.MeshStandardMaterial({color:0x4a331f}));
      bowArc.rotation.y = Math.PI/2; bowArc.position.set(-.05,1.0,-.28); g.add(bowArc);
    } else if(type==='fanatic'){
      const cleaver = new THREE.Mesh(new THREE.BoxGeometry(.06,.42,.28), new THREE.MeshStandardMaterial({color:0x8a7a6a, metalness:.4}));
      cleaver.position.set(.5,1.25,0); g.add(cleaver);
    } else if(type==='conspirator'){
      const circlet = new THREE.Mesh(new THREE.TorusGeometry(.2,.03,6,10), new THREE.MeshStandardMaterial({color:0x8a6a2a, metalness:.7}));
      circlet.rotation.x = Math.PI/2; circlet.position.set(0,2.0,0); g.add(circlet);
      const blade = new THREE.Mesh(new THREE.BoxGeometry(.07,.62,.36), new THREE.MeshStandardMaterial({color:0x9a8f7c, metalness:.6}));

  function makeCrate(){
    const m = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshStandardMaterial({color:0x5a4530, roughness:.9}));
    m.castShadow = true; m.receiveShadow = true;

  function makeBarrel(){

  function makeTorchPost(){
    const g = new THREE.Group();
    const post = new THREE.Mesh(new THREE.CylinderGeometry(.06,.08,2.2,6), new THREE.MeshStandardMaterial({color:0x3a2a1a}));
    post.position.y = 1.1; g.add(post);

  function makeBarricadeSeg(){
    const g = new THREE.Group();
    const plankMat = new THREE.MeshStandardMaterial({color:0x4a3722, roughness:.9});
    for(let i=0;i<4;i++){
      const plank = new THREE.Mesh(new THREE.BoxGeometry(2.4,.14,.12), plankMat);
      plank.position.set(0, .3+i*.32, (i%2)*0.08);
      plank.rotation.z = (Math.random()-.5)*.08;
      g.add(plank);
    }
    for(let i=0;i<3;i++){
      const spike = new THREE.Mesh(new THREE.ConeGeometry(.05,.5,5), new THREE.MeshStandardMaterial({color:0x2a2018}));
      spike.position.set(-.9+i*.9, 1.35, 0);
      spike.rotation.x = Math.PI/2.4;
      g.add(spike);
    }
    g.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
    return g;
  }
  function makeTree(){
    const g = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.18,.26,2.2,6), new THREE.MeshStandardMaterial({color:0x3a2a18, roughness:.95}));
    trunk.position.y = 1.1; g.add(trunk);
    const foliageA = new THREE.MeshStandardMaterial({color:0x2e4a28, roughness:.9});

    const c2 = new THREE.Mesh(new THREE.ConeGeometry(1.0,1.7,7), foliageB); c2.position.y = 3.9; g.add(c2);
    const c3 = new THREE.Mesh(new THREE.ConeGeometry(.7,1.3,7), foliageA); c3.position.y = 4.7; g.add(c3);

  const WATER_MAT = () => new THREE.MeshStandardMaterial({color:0x0f3a4a, roughness:.2, metalness:.2, transparent:true, opacity:.85, side:THREE.DoubleSide});
  const BED_MAT = () => new THREE.MeshStandardMaterial({color:0x152a24, roughness:1});

  function buildRiverAndBridge(cfg){
    const lineZ = cfg.radius*0.35;
    const span = cfg.radius*1.5;
    const riverWidth = 10;

    const bed = new THREE.Mesh(new THREE.PlaneGeometry(span, riverWidth+1.5), BED_MAT());
    bed.rotation.x = -Math.PI/2;
    bed.position.set(0, 0.015, lineZ);
    bed.receiveShadow = true;
    scene.add(bed); envMeshes.push(bed);

    const water = new THREE.Mesh(new THREE.PlaneGeometry(span, riverWidth), WATER_MAT());
    water.rotation.x = -Math.PI/2;
    water.position.set(0, 0.06, lineZ);
    scene.add(water); envMeshes.push(water);

    const bridgeHalfWidth = 3.2;
    const segCount = Math.ceil(span/2.4);
    for(let i=0;i<segCount;i++){
      const x = -span/2 + (i+0.5)*(span/segCount);
      if(Math.abs(x) < bridgeHalfWidth) continue;
      obstacles.push({x, z: lineZ - riverWidth/2 - 0.5, radius:1.3});
      obstacles.push({x, z: lineZ + riverWidth/2 + 0.5, radius:1.3});
    }

    const deck = new THREE.Mesh(new THREE.BoxGeometry(bridgeHalfWidth*2, .25, riverWidth+2.6), new THREE.MeshStandardMaterial({color:0x4a3722, roughness:.9}));
    deck.position.set(0, .22, lineZ);
    deck.castShadow = true; deck.receiveShadow = true;
    scene.add(deck); envMeshes.push(deck);
    [-1,1].forEach(side=>{
      const rail = new THREE.Mesh(new THREE.BoxGeometry(bridgeHalfWidth*2, .12, .12), new THREE.MeshStandardMaterial({color:0x3a2a18}));
      rail.position.set(0, .67, lineZ + side*(riverWidth/2+1.2));
      scene.add(rail); envMeshes.push(rail);
      for(let p=-1;p<=1;p++){
        const post = new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.7,6), new THREE.MeshStandardMaterial({color:0x3a2a18}));
        post.position.set(p*bridgeHalfWidth*0.9, .47, lineZ + side*(riverWidth/2+1.2));
        scene.add(post); envMeshes.push(post);
      }
    });
  }

  function buildHarbor(cfg){
    const waterNearZ = -cfg.radius*0.62;
    const waterFarZ = -cfg.radius*2.0;
    const waterWidth = cfg.radius*3.0;
    const waterDepth = Math.abs(waterFarZ-waterNearZ);

    const bed = new THREE.Mesh(new THREE.PlaneGeometry(waterWidth+8, waterDepth+8), BED_MAT());
    bed.rotation.x = -Math.PI/2;
    bed.position.set(0, 0.015, (waterNearZ+waterFarZ)/2);
    bed.receiveShadow = true;
    scene.add(bed); envMeshes.push(bed);

    const water = new THREE.Mesh(new THREE.PlaneGeometry(waterWidth, waterDepth), WATER_MAT());
    water.rotation.x = -Math.PI/2;
    water.position.set(0, 0.06, (waterNearZ+waterFarZ)/2);
    scene.add(water); envMeshes.push(water);

    const pierHalfWidth = 2.2;
    const pier = new THREE.Mesh(new THREE.BoxGeometry(pierHalfWidth*2, .25, waterDepth*0.55), new THREE.MeshStandardMaterial({color:0x4a3722, roughness:.9}));
    pier.position.set(0, .22, waterNearZ - waterDepth*0.28);
    pier.castShadow = true; pier.receiveShadow = true;
    scene.add(pier); envMeshes.push(pier);

    const lineSpan = waterWidth*0.9;
    const segCount = Math.ceil(lineSpan/1.6);
    for(let i=0;i<segCount;i++){
      const x = -lineSpan/2 + (i+0.5)*(lineSpan/segCount);
      if(Math.abs(x) < pierHalfWidth+0.6) continue;
      obstacles.push({x, z:waterNearZ, radius:0.9});
    }

    for(let i=-1;i<=1;i+=2){
      for(let j=0;j<3;j++){
        const post = new THREE.Mesh(new THREE.CylinderGeometry(.1,.12,1.1,6), new THREE.MeshStandardMaterial({color:0x3a2a18}));
        post.position.set(i*(pierHalfWidth-0.3), .6, waterNearZ - j*3.2 - 1.5);
        scene.add(post); envMeshes.push(post);
      }
    }
    [[-7, waterNearZ-4],[8, waterNearZ-7],[-3, waterNearZ-10]].forEach(([bx,bz])=>{
      const hull = new THREE.Mesh(new THREE.BoxGeometry(3.2,.7,1.4), new THREE.MeshStandardMaterial({color:0x3a2a1c, roughness:.9}));
      hull.position.set(bx, .15, bz);
      hull.rotation.y = (Math.random()-.5)*.6;
      hull.castShadow = true;
      scene.add(hull); envMeshes.push(hull);
      const mast = new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,2.4,6), new THREE.MeshStandardMaterial({color:0x4a3722}));
      mast.position.set(bx, 1.4, bz);
      scene.add(mast); envMeshes.push(mast);
    });
  }

  function buildPrisonYard(cfg){
    const wallMat = new THREE.MeshStandardMaterial({color:0x55504a, roughness:.95});
    const roofMat = new THREE.MeshStandardMaterial({color:0x2e2620, roughness:.9});
    const hw = Math.min(cfg.radius*0.24, 14);
    const wallH = 3.2;
    const gateHalf = 2.4;
    const cx = 0, cz = -cfg.radius*0.05;

    function addWallRun(axis, fixedCoord, from, to){
      if(to<=from) return;
      const len = to-from, mid = (from+to)/2;
      const geo = axis==='x' ? new THREE.BoxGeometry(len, wallH, .6) : new THREE.BoxGeometry(.6, wallH, len);
      const wall = new THREE.Mesh(geo, wallMat);
      if(axis==='x') wall.position.set(cx+mid, wallH/2, cz+fixedCoord);
      else wall.position.set(cx+fixedCoord, wallH/2, cz+mid);
      wall.castShadow = true; wall.receiveShadow = true;
      scene.add(wall); envMeshes.push(wall);
      const obsCount = Math.max(1, Math.round(len/1.6));
      for(let i=0;i<obsCount;i++){
        const t = (i+0.5)/obsCount, coord = from + t*len;
        if(axis==='x') obstacles.push({x:cx+coord, z:cz+fixedCoord, radius:0.85});
        else obstacles.push({x:cx+fixedCoord, z:cz+coord, radius:0.85});
      }
    }
    // south wall (facing the player's approach) has a gate gap
    addWallRun('x', hw, -hw, -gateHalf);
    addWallRun('x', hw, gateHalf, hw);
    addWallRun('x', -hw, -hw, hw);
    addWallRun('z', hw, -hw, hw);
    addWallRun('z', -hw, -hw, hw);

    [[-hw,-hw],[-hw,hw],[hw,-hw],[hw,hw]].forEach(([px,pz])=>{
      const post = new THREE.Mesh(new THREE.CylinderGeometry(1.0,1.1,wallH+1.4,8), wallMat);
      post.position.set(cx+px, (wallH+1.4)/2, cz+pz);
      post.castShadow = true; post.receiveShadow = true;
      scene.add(post); envMeshes.push(post);
      const roof = new THREE.Mesh(new THREE.ConeGeometry(1.3,1.1,8), roofMat);
      roof.position.set(cx+px, wallH+1.4+0.55, cz+pz);
      scene.add(roof); envMeshes.push(roof);
    });
    [-1,1].forEach(side=>{
      const post = new THREE.Mesh(new THREE.BoxGeometry(.5, wallH+.6, .5), wallMat);
      post.position.set(cx+side*gateHalf, (wallH+.6)/2, cz+hw);
      scene.add(post); envMeshes.push(post);
    });
  }

  // ================= SCENE DATA =================
  const envMeshes = [];
  const obstacles = [];
  const rebels = [];  // enemy roster for the current battle
  const army = [];    // player's deployed allies for the current battle
  const particles = [];
  const projectiles = [];
  const goldPickups = [];
  let WORLD_BOUND = 60;

  function clearBattle(){
    envMeshes.forEach(m=> scene.remove(m));
    envMeshes.length = 0;
    obstacles.length = 0;
    rebels.forEach(v=> scene.remove(v.mesh));
    rebels.length = 0;
    army.forEach(a=> scene.remove(a.mesh));
    army.length = 0;
    particles.forEach(p=> scene.remove(p.mesh));
    particles.length = 0;
    projectiles.forEach(p=> scene.remove(p.mesh));
    projectiles.length = 0;
    goldPickups.forEach(g=> scene.remove(g.mesh));
    goldPickups.length = 0;
    if(ground) scene.remove(ground);
    if(hemi) scene.remove(hemi);
    if(sunLight) scene.remove(sunLight);
    scene.fog = null;
    bossSpawned = false;
  }

  function buildBattle(idx){
    clearBattle();
    const cfg = BATTLES[idx];
    currentCfg = cfg;
    pendingBattleIdx = idx;
    WORLD_BOUND = cfg.radius * 1.6;

    scene.fog = new THREE.FogExp2(cfg.fog, 1/(cfg.radius*2.4));
    renderer.setClearColor(cfg.fog);
    hemi = new THREE.HemisphereLight(cfg.sun, cfg.ambient, .9);
    scene.add(hemi);
    sunLight = new THREE.DirectionalLight(cfg.sun, .8);
    sunLight.position.set(30,50,20);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(1024,1024);
    sunLight.shadow.camera.left = -60; sunLight.shadow.camera.right = 60;
    sunLight.shadow.camera.top = 60; sunLight.shadow.camera.bottom = -60;
    scene.add(sunLight);

    groundMat = new THREE.MeshStandardMaterial({ color:0x3a3226, roughness:1 });
    ground = new THREE.Mesh(new THREE.PlaneGeometry(WORLD_BOUND*2.4, WORLD_BOUND*2.4), groundMat);
    ground.rotation.x = -Math.PI/2;
    ground.receiveShadow = true;
    scene.add(ground);

    // scattered props for atmosphere
    const propCount = 18 + Math.floor(cfg.radius*0.4);
    for(let i=0;i<propCount;i++){
      const ang = Math.random()*Math.PI*2;
      const rad = cfg.radius*0.3 + Math.random()*cfg.radius*0.9;
      const x = Math.cos(ang)*rad, z = Math.sin(ang)*rad;
      let prop;
      const roll = Math.random();
      if(roll<0.4) prop = makeCrate();
      else if(roll<0.75) prop = makeBarrel();
      else prop = makeTorchPost();
      prop.position.set(x,0,z);
      prop.rotation.y = Math.random()*Math.PI;
      scene.add(prop); envMeshes.push(prop);
      if(roll<0.75) obstacles.push({x,z,radius: roll<0.4?0.75:0.5});
    }

    // treeline around the battlefield's edge
    const treeCount = 16 + Math.floor(cfg.radius*0.35);
    for(let i=0;i<treeCount;i++){
      const ang = Math.random()*Math.PI*2;
      const rad = cfg.radius*0.95 + Math.random()*cfg.radius*0.5;
      const x = Math.cos(ang)*rad, z = Math.sin(ang)*rad;
      const tree = makeTree();
      tree.position.set(x,0,z);
      tree.scale.setScalar(0.85+Math.random()*0.4);
      tree.rotation.y = Math.random()*Math.PI*2;
      scene.add(tree); envMeshes.push(tree);
      obstacles.push({x,z,radius:0.9});
    }

    // barricade chokepoint
    if(cfg.hasBarricade){
      const lineZ = cfg.radius*0.35;
      const span = cfg.radius*1.1;
      const segCount = Math.max(5, Math.round(span/2.6));
      const gapIdx = Math.floor(segCount/2);
      for(let i=0;i<segCount;i++){
        if(i===gapIdx || i===gapIdx-1) continue; // leave a gap to fight through
        const x = -span/2 + i*(span/segCount);
        const seg = makeBarricadeSeg();
        seg.position.set(x, 0, lineZ);
        scene.add(seg); envMeshes.push(seg);
        obstacles.push({x, z:lineZ, radius:1.3});
      }
    }

    // narrative set pieces
    if(cfg.hasBridge) buildRiverAndBridge(cfg);
    if(cfg.hasHarbor) buildHarbor(cfg);
    if(cfg.hasPrison) buildPrisonYard(cfg);

    // player spawn
    player.position.set(0,0, cfg.radius*1.15);
    player.rotation.y = Math.PI;
    camera.rotation.set(0,0,0);
    P.health = P.maxHealth; P.stamina = P.maxStamina; P.dead = false;
    P.armor = P.maxArmor;
    regenDelay = 0;

    // deploy army from owned roster, round-robin up to deployCap
    const pool = [];
    const types = ['guard','spearman','archer','berserker'];
    let remaining = { ...ownedUnits };
    let deployed = 0;
    while(deployed < cfg.deployCap){
      let addedAny = false;
      for(const t of types){
        if(deployed >= cfg.deployCap) break;
        if(remaining[t] > 0){ pool.push(t); remaining[t]--; deployed++; addedAny = true; }
      }
      if(!addedAny) break;
    }
    pool.forEach((type,i)=>{
      const ut = UNIT_TYPES[type];
      const ang = (i/Math.max(1,pool.length))*Math.PI*2;
      const x = player.position.x + Math.cos(ang)*4, z = player.position.z + Math.sin(ang)*4 + cfg.radius*0.02;
      const mesh = makeSoldier(type);
      mesh.position.set(x,0,z);
      scene.add(mesh);
      army.push({
        mesh, type, hp:ut.hp, maxHp:ut.hp, dead:false, target:null,
        attackTimer: Math.random()*0.5, holdPos:new THREE.Vector3(x,0,z), formAngle: ang
      });
    });

    // spawn rebels scattered across the field, keeping clear of the player's spawn point and any water
    cfg.enemyMix.forEach(type=>{
      const rt = REBEL_TYPES[type];
      let x,z,tries=0;
      do{
        const ang = Math.random()*Math.PI*2;
        const rad = cfg.radius*0.15 + Math.random()*cfg.radius*0.7;
        x = Math.cos(ang)*rad; z = Math.sin(ang)*rad;
        tries++;
      } while((
        Math.hypot(x-player.position.x, z-player.position.z) < 14 ||
        (cfg.hasBridge && Math.abs(z - cfg.radius*0.35) < 7) ||
        (cfg.hasHarbor && z < -cfg.radius*0.55)
      ) && tries<14);
      const mesh = makeRebel(type);
      mesh.position.set(x,0,z);
      scene.add(mesh);
      rebels.push({
        mesh, type, isRebel:true,
        hp: rt.hp*cfg.powerMult, maxHp: rt.hp*cfg.powerMult,
        dmgRange: rt.dmg.map(d=>d*cfg.powerMult),
        speed: rt.speed, range: rt.range, ranged: rt.ranged, atkCooldownBase: rt.atkCooldown,
        alertRadius: rt.alertRadius, state:'wander', home:new THREE.Vector3(x,0,z),
        target:null, wanderTimer: Math.random()*2, calmTimer:0, attackTimer:0.6, dead:false, fallProgress:0
      });
    });

    allyStance = 'hold';
    updateStanceHUD();
    updateHUD();
    updateCounts();
  }

  // ================= SFX / FX =================
  const audioCtx = (window.AudioContext||window.webkitAudioContext) ? new (window.AudioContext||window.webkitAudioContext)() : null;
  function sfx(kind){
    if(!audioCtx) return;
    try{
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      let f1=200,f2=100,dur=.12,type='sine',vol=.15;
      if(kind==='swing'){ f1=180; f2=90; dur=.09; type='triangle'; vol=.1; }
      else if(kind==='hit'){ f1=340; f2=120; dur=.1; type='square'; vol=.14; }
      else if(kind==='hurt'){ f1=120; f2=60; dur=.2; type='sawtooth'; vol=.16; }
      else if(kind==='gold'){ f1=800; f2=1200; dur=.08; type='sine'; vol=.08; }
      else if(kind==='armor'){ f1=140; f2=90; dur=.18; type='square'; vol=.12; }
      o.type = type;
      o.frequency.setValueAtTime(f1, now);
      o.frequency.exponentialRampToValueAtTime(Math.max(30,f2), now+dur);
      g.gain.setValueAtTime(vol, now);
      g.gain.exponentialRampToValueAtTime(0.001, now+dur);
      o.start(now); o.stop(now+dur);
    }catch(e){}
  }
  function burst(pos, color, count){
    count = count || 8;
    for(let i=0;i<count;i++){
      const m = new THREE.Mesh(new THREE.BoxGeometry(.06,.06,.06), new THREE.MeshBasicMaterial({color}));
      m.position.copy(pos);
      m.position.y += 1.0 + Math.random()*.4;
      scene.add(m);
      particles.push({ mesh:m, vel:new THREE.Vector3((Math.random()-.5)*3, Math.random()*3+1, (Math.random()-.5)*3), life:0.6 });
    }
  }
  function updateParticles(dt){
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.life -= dt;
      if(p.life<=0){ scene.remove(p.mesh); particles.splice(i,1); continue; }
      p.vel.y -= 9*dt;
      p.mesh.position.addScaledVector(p.vel, dt);
      p.mesh.material.opacity = Math.max(0, p.life/0.6);
      p.mesh.material.transparent = true;
    }
  }
  function fireArrow(fromPos, toPos, color){
    const arrow = new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,.5,5), new THREE.MeshBasicMaterial({color: color||0xd6c49a}));
    arrow.position.copy(fromPos); arrow.position.y += 1.3;
    const dir = new THREE.Vector3().subVectors(toPos, fromPos); dir.y = 0;
    const dist = dir.length();
    dir.normalize();
    arrow.rotation.y = Math.atan2(dir.x, dir.z) + Math.PI/2;
    arrow.rotation.z = Math.PI/2;
    scene.add(arrow);
    projectiles.push({ mesh:arrow, dir, speed:26, life: Math.min(1.2, dist/22 + 0.1) });
  }
  function updateProjectiles(dt){
    for(let i=projectiles.length-1;i>=0;i--){
      const pr = projectiles[i];
      pr.life -= dt;
      pr.mesh.position.x += pr.dir.x*pr.speed*dt;
      pr.mesh.position.z += pr.dir.z*pr.speed*dt;
      if(pr.life<=0){ scene.remove(pr.mesh); projectiles.splice(i,1); }
    }
  }

  function updateSwing(dt){
    if(!isSwinging) return;
    swingT += dt / currentSword.cooldown;
    const prog = Math.min(1, swingT);
    const ease = prog*prog*(3-2*prog);
    // the grip (bottom, near the rotation pivot) stays close to its resting spot;
    // the blade (top) is what sweeps through a wide arc, so the point is what
    // visibly cuts across the screen, not the hilt
    swordGroup.position.x = 0.30 - ease*0.16;
    swordGroup.position.y = -0.30 - ease*0.05;
    swordGroup.position.z = -0.55 - ease*0.18;
    swordGroup.rotation.z = 1.15 - ease*2.15;
    swordGroup.rotation.x = -0.35 + ease*0.55;
    swordGroup.rotation.y = 0.15 - ease*0.30;
    if(prog>0.18 && prog<0.82) doHitCheck();
    if(swingT >= 1){
      isSwinging = false;
      swordGroup.position.set(0.32,-0.32,-0.55);
      swordGroup.rotation.set(0.25,-0.15,-0.35);

  function doHitCheck(){
    const fwd = new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);
    rebels.forEach(v=>{
      if(v.dead || swingHitSet.has(v)) return;
      const toV = new THREE.Vector3().subVectors(v.mesh.position, player.position);
      const d = toV.length();
      if(d > currentSword.range + 0.6) return;
      toV.normalize();
      if(fwd.dot(toV) < 0.35) return;
      swingHitSet.add(v);
      const dmg = currentSword.dmg[0] + Math.random()*(currentSword.dmg[1]-currentSword.dmg[0]);
      v.hp -= dmg;

  // ================= MOVEMENT =================
  function pushOutOfObstacles(pos, radius){
    obstacles.forEach(o=>{
      const dx=pos.x-o.x, dz=pos.z-o.z, d=Math.sqrt(dx*dx+dz*dz), minD=o.radius+radius;
      if(d<minD && d>0.0001){ pos.x += (dx/d)*(minD-d); pos.z += (dz/d)*(minD-d); }
    });
  }
  function updateMovement(dt){
    const forward = new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
    const right = new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
    let mv = new THREE.Vector3();
    if(keys['KeyW']) mv.add(forward);
    if(keys['KeyS']) mv.sub(forward);
    if(keys['KeyD']) mv.add(right);
    if(keys['KeyA']) mv.sub(right);
    const sprinting = keys['ShiftLeft'] && P.stamina>1 && mv.lengthSq()>0;
    if(sprinting){ P.stamina = Math.max(0, P.stamina - dt*22); }
    else { P.stamina = Math.min(P.maxStamina, P.stamina + dt*12); }
    const speed = sprinting ? 8.6 : 5.8;
    if(mv.lengthSq()>0){ mv.normalize().multiplyScalar(speed*dt); }
    const newPos = player.position.clone().add(mv);
    const d = Math.hypot(newPos.x,newPos.z);
    if(d > WORLD_BOUND){ const s=WORLD_BOUND/d; newPos.x*=s; newPos.z*=s; }
    pushOutOfObstacles(newPos, PLAYER_RADIUS);
    player.position.copy(newPos);
  }

  // ================= COMBAT HELPERS =================
  function dist2D(a,b){ return Math.hypot(a.x-b.x, a.z-b.z); }
  function moveTowards(mesh, targetPos, speed, dt, stopDist){
    const dx = targetPos.x-mesh.position.x, dz = targetPos.z-mesh.position.z;
    const d = Math.hypot(dx,dz);
    if(d < (stopDist||0.3)) return;
    const nx = dx/d, nz = dz/d;
    const newX = mesh.position.x + nx*speed*dt;
    const newZ = mesh.position.z + nz*speed*dt;
    const pos = new THREE.Vector3(newX,0,newZ);
    pushOutOfObstacles(pos, 0.45);
    mesh.position.x = pos.x; mesh.position.z = pos.z;
    mesh.rotation.y = Math.atan2(nx,nz);
  }

  const HEALTH_REGEN_DELAY = 6.5; // seconds of no damage before regen kicks in
  const HEALTH_REGEN_RATE = 3.0;  // health per second once regenerating
  let regenDelay = 0;

  function hurtPlayer(dmg){
    if(P.dead) return;
    let remaining = dmg;
    if(P.armor>0){
      const absorbed = Math.min(P.armor, remaining*0.6);
      P.armor -= absorbed; remaining -= absorbed;
      sfx('armor');
    }
    P.health -= remaining;
    regenDelay = HEALTH_REGEN_DELAY;
    sfx('hurt');
    if(P.health<=0 && !P.dead){
      P.health = 0; P.dead = true;
      intentionalUnlock = true;
      document.exitPointerLock();
      endBattle('dead');
    }
  }

  function updateHealthRegen(dt){
    if(P.dead) return;
    if(regenDelay > 0){ regenDelay -= dt; return; }
    if(P.health < P.maxHealth){
      P.health = Math.min(P.maxHealth, P.health + HEALTH_REGEN_RATE*dt);
    }
  }

  // ================= REBEL AI =================
  function nearestFoe(v){
    // rebels target whichever of {player, army units} is nearest and alive
    let best = null, bestD = Infinity, bestIsPlayer = false;
    const dP = dist2D(v.mesh.position, player.position);
    if(dP < bestD){ bestD = dP; best = 'player'; bestIsPlayer = true; }
    army.forEach(a=>{
      if(a.dead) return;
      const d = dist2D(v.mesh.position, a.mesh.position);
      if(d < bestD){ bestD = d; best = a; bestIsPlayer = false; }
    });
    return { target:best, dist:bestD, isPlayer:bestIsPlayer };
  }
  function foePos(target, isPlayer){ return isPlayer ? player.position : target.mesh.position; }

  function updateRebels(dt){
    rebels.forEach(v=>{
      if(v.dead) return;
      v.mesh.position.y = 0;
      const foe = nearestFoe(v);
      if(v.state==='wander'){
        v.wanderTimer -= dt;
        if(foe.dist < v.alertRadius){ v.state='attack'; v.target=foe.target; }
        else if(v.wanderTimer<=0){
          v.wanderTimer = 2+Math.random()*2;
          const ang = Math.random()*Math.PI*2, rad = Math.random()*3;
          const wp = new THREE.Vector3(v.home.x+Math.cos(ang)*rad, 0, v.home.z+Math.sin(ang)*rad);
          moveTowards(v.mesh, wp, v.speed*0.4, dt, 0.4);
        }
        return;
      }
      if(v.state==='attack'){
        const isPlayer = v.target==='player';
        const tp = isPlayer ? player.position : (v.target && !v.target.dead ? v.target.mesh.position : null);
        if(!tp || (!isPlayer && v.target.dead)){
          v.state='wander'; v.calmTimer=1.5; v.target=null; return;
        }
        const d = dist2D(v.mesh.position, tp);
        if(d > v.alertRadius*1.6){ v.state='wander'; v.target=null; return; }
        if(d > v.range){
          moveTowards(v.mesh, tp, v.speed, dt, v.range*0.9);
          v.mesh.lookAt(tp.x, v.mesh.position.y, tp.z);
        } else {
          v.mesh.lookAt(tp.x, v.mesh.position.y, tp.z);
          v.attackTimer -= dt;
          if(v.attackTimer<=0){
            v.attackTimer = v.atkCooldownBase;
            const dmg = v.dmgRange[0] + Math.random()*(v.dmgRange[1]-v.dmgRange[0]);
            if(v.ranged) fireArrow(v.mesh.position, tp, 0xb04040);
            if(isPlayer) hurtPlayer(dmg);
            else {
              v.target.hp -= dmg;
              burst(v.target.mesh.position, 0xc73e3e, 5);
              if(v.target.hp<=0 && !v.target.dead) killSoldier(v.target);
            }
          }
        }
      }
    });
  }

  // ================= ARMY AI (I/O/P command stances) =================
  function nearestRebelTo(pos, maxD){
    let best=null, bestD = maxD||Infinity;
    rebels.forEach(v=>{
      if(v.dead) return;
      const d = dist2D(v.mesh.position, pos);
      if(d < bestD){ bestD=d; best=v; }
    });
    return best;
  }
  function engageAsAlly(a, dt){
    const ut = UNIT_TYPES[a.type];
    const tp = a.target.mesh.position;
    const d = dist2D(a.mesh.position, tp);
    if(d > ut.range){
      moveTowards(a.mesh, tp, ut.speed, dt, ut.range*0.9);
      a.mesh.lookAt(tp.x, a.mesh.position.y, tp.z);
      return;
    }
    a.mesh.lookAt(tp.x, a.mesh.position.y, tp.z);
    a.attackTimer -= dt;
    if(a.attackTimer<=0){
      a.attackTimer = ut.atkCooldown;
      const dmg = ut.dmg[0] + Math.random()*(ut.dmg[1]-ut.dmg[0]);
      if(ut.ranged) fireArrow(a.mesh.position, tp, 0x8fc0e8);
      a.target.hp -= dmg;
      burst(a.target.mesh.position, 0xc73e3e, 5);
      if(a.target.hp<=0 && !a.target.dead){ killRebel(a.target, true); a.target=null; }
    }
  }
  function updateArmy(dt){
    army.forEach(a=>{
      if(a.dead) return;
      a.mesh.position.y = 0;
      if(a.target && a.target.dead) a.target = null;

      if(allyStance==='protect'){
        const near = nearestRebelTo(player.position, 10);
        if(near){ a.target = near; engageAsAlly(a, dt); }
        else {
          const ang = a.formAngle + clock.elapsedTime*0.15;
          const fp = new THREE.Vector3(player.position.x+Math.cos(ang)*3.4, 0, player.position.z+Math.sin(ang)*3.4);
          moveTowards(a.mesh, fp, UNIT_TYPES[a.type].speed, dt, 0.5);
        }
      } else if(allyStance==='hold'){
        const near = nearestRebelTo(a.holdPos, 11);
        if(near){ a.target = near; engageAsAlly(a, dt); }
        else moveTowards(a.mesh, a.holdPos, UNIT_TYPES[a.type].speed, dt, 0.5);
      } else { // advance
        let best=null, bestD=Infinity;
        rebels.forEach(v=>{
          if(v.dead) return;
          const d = dist2D(v.mesh.position, a.mesh.position);
          if(d<bestD){ bestD=d; best=v; }
        });
        if(best){ a.target = best; engageAsAlly(a, dt); }
      }
    });
  }

  // ================= PASSWORD SAVE SYSTEM =================
  function encodePassword(){
    const state = {
      g: gold,
      sw: Array.from(ownedSwords), esw: equippedSwordId,
      ar: Array.from(ownedArmor), ea: equippedArmorId,
      u: ownedUnits,
      bc: battlesCleared.map(c=>c?1:0)
    };
    try{ return btoa(unescape(encodeURIComponent(JSON.stringify(state)))).replace(/=+$/,''); }
    catch(e){ return ''; }
  }
  function applyPassword(raw){
    if(!raw) return false;
    try{
      const json = decodeURIComponent(escape(atob(raw.trim())));
      const state = JSON.parse(json);
      if(typeof state.g !== 'number') return false;
      gold = Math.max(0, Math.floor(state.g)||0);

      ownedSwords.clear(); ownedSwords.add('iron');
      (state.sw||[]).forEach(id=>{ if(SWORDS.some(s=>s.id===id)) ownedSwords.add(id); });
      equippedSwordId = ownedSwords.has(state.esw) ? state.esw : 'iron';
      currentSword = SWORDS.find(s=>s.id===equippedSwordId) || SWORDS[0];
      buildSwordMesh(currentSword);

      ownedArmor.clear();
      (state.ar||[]).forEach(id=>{ if(ARMORS.some(a=>a.id===id)) ownedArmor.add(id); });
      equippedArmorId = (state.ea && ownedArmor.has(state.ea)) ? state.ea : null;
      currentArmor = equippedArmorId ? ARMORS.find(a=>a.id===equippedArmorId) : null;
      P.maxArmor = currentArmor ? currentArmor.armor : 0;

      if(state.u){
        Object.keys(ownedUnits).forEach(t=>{ ownedUnits[t] = Math.max(0, Math.floor(state.u[t])||0); });
      }
      if(Array.isArray(state.bc)){
        for(let i=0;i<battlesCleared.length;i++) battlesCleared[i] = !!state.bc[i];
      }

      const gc = document.getElementById('goldCount'); if(gc) gc.textContent = gold;
      const sp = document.getElementById('swordPill'); if(sp) sp.textContent = currentSword.name;
      return true;
    }catch(e){ return false; }
  }

      const unlocked = isUnlocked(i);
      const cleared = battlesCleared[i];
      return `<div class="vcard ${unlocked?'':'locked'} ${cleared?'cleared':''}" ${unlocked?`data-action="view-battle" data-idx="${i}"`:''}>
        <span class="diff diff-${b.difficulty}">${b.difficulty}</span>
        <h3>${i+1}. ${b.name}</h3>
        <p>${unlocked ? b.desc : 'Win the previous battle to unlock this one.'}</p>
        ${unlocked ? `<div class="mix">${mixSummary(b)}<br>Deploy up to ${b.deployCap} of your army</div>` : ''}
      </div>`;
    }).join('');
    overlay.innerHTML = `
      <h1>KING OF VILLAGERS</h1>
      <div class="sub">${msg||'The Campaign Against the Uprising'}</div>
      <div class="statusrow">
        <span>⛁ <b>${gold}</b> gold</span>
        <span>Sword: <b>${currentSword.name}</b></span>
        <span>Armor: <b>${currentArmor?currentArmor.name:'none'}</b></span>
        <span>Army: <b>${ownedUnits.guard+ownedUnits.spearman+ownedUnits.archer+ownedUnits.berserker}</b></span>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:18px;">
        <input id="pwLoadInputSelect" placeholder="Have a password? Paste it here to restore your progress..." style="width:360px;max-width:75vw;padding:9px;border-radius:4px;border:1px solid rgba(154,163,171,.4);background:rgba(0,0,0,.35);color:var(--bone);font-family:monospace;font-size:11px;">
        <button data-action="load-password" data-target="pwLoadInputSelect" style="font-family:'Cinzel',serif;font-weight:700;padding:8px 16px;background:rgba(90,140,200,.25);border:1px solid #6a9ac9;color:var(--bone);border-radius:4px;cursor:pointer;font-size:11.5px;letter-spacing:1px;">Load Password</button>
      </div>
      <div class="cardgrid">${cards}</div>
      <button class="bigbtn" data-action="open-camp">Return to the Palace</button>
    `;
    overlay.style.display = 'flex';
  }

  function renderBriefing(idx){
    phase = 'briefing';
    const b = BATTLES[idx];
    const deployedCount = Math.min(b.deployCap, ownedUnits.guard+ownedUnits.spearman+ownedUnits.archer+ownedUnits.berserker);
    overlay.innerHTML = `
      <h1 style="font-size:34px">${b.name}</h1>
      <div class="sub diff-${b.difficulty}" style="display:inline-block;padding:3px 12px;border-radius:12px;">${b.difficulty}</div>
      <div class="controls" style="max-width:600px;margin-top:16px;">
        ${b.desc}<br><br>
        ${b.hasBarricade? 'The rebels have thrown up a barricade — find the gap or force your way through.<br>':''}
        ${b.isFinal? `${CONSPIRATOR_NAME} will not show himself until every rebel before him has fallen.<br>`:''}
        You will deploy ${deployedCount} of your army (auto-mustered from your ranks, up to ${b.deployCap} for this battle).<br>
        Your health regenerates slowly if you avoid taking damage for a few seconds.<br><br>
        <b>I</b> — order your forces to advance and seek the enemy.<br>
        <b>O</b> — order your forces to hold their ground where they stand.<br>
        <b>P</b> — order your forces to protect the king.<br>
        <b>Q</b> — retreat from the battle at any time.
      </div>
      <button class="bigbtn" data-action="start-battle" data-idx="${idx}" style="margin-top:22px;">Begin the Battle</button><br>
      <button class="bigbtn" data-action="back-to-select" style="margin-top:14px;background:linear-gradient(180deg,#3a3a44,#1a1a20);font-size:12px;padding:9px 22px;">Back</button>
    `;
    overlay.style.display = 'flex';
  }

  function renderPaused(){
    overlay.style.background = '';
    const pw = encodePassword();
    overlay.innerHTML = `
      <h1 style="font-size:34px">PAUSED</h1>
      <div class="sub" style="margin-bottom:6px;">Your Password</div>
      <div class="controls" style="max-width:520px;margin-bottom:10px;">Save this password somewhere safe to restore your gold, gear, army, and campaign progress later.</div>
      <textarea id="pwBox" readonly onclick="this.select()" style="width:420px;max-width:90vw;height:58px;background:rgba(0,0,0,.4);color:var(--bone);border:1px solid rgba(214,138,60,.4);border-radius:4px;padding:8px;font-family:monospace;font-size:11px;margin-bottom:10px;">${pw}</textarea><br>
      <button class="bigbtn" data-action="copy-password" data-target="pwBox" style="font-size:12.5px;padding:8px 20px;margin-bottom:18px;">Copy Password</button><br>
      <button class="bigbtn" data-action="resume">Resume Battle</button>
      <button class="bigbtn" style="margin-top:12px;background:linear-gradient(180deg,#8a1f1f,#5a0f0f)" data-action="retreat">Retreat</button>
    `;
    overlay.style.display = 'flex';
  }

  function renderFinale(){
    phase = 'finale';
    document.getElementById('hud').style.display = 'none';
    overlay.style.background = '#000';
    overlay.innerHTML = `
      <div id="finaleText" style="max-width:680px;font-family:'Cinzel',serif;font-size:21px;line-height:2.1;color:var(--bone);opacity:0;transition:opacity 3s ease-in;padding:40px;text-align:center;">
        ${CONSPIRATOR_NAME} lay broken before the throne he coveted, and the rebellion broke with him. The King of Villagers had returned — and his kingdom, at terrible cost, was his once more.
      </div>
      <button class="bigbtn" id="finaleBtn" data-action="finale-continue" style="opacity:0;transition:opacity 1.5s ease-in;">Return to the Palace</button>
    `;
    overlay.style.display = 'flex';
    setTimeout(()=>{ const t=document.getElementById('finaleText'); if(t) t.style.opacity='1'; }, 400);
    setTimeout(()=>{ const b=document.getElementById('finaleBtn'); if(b) b.style.opacity='1'; }, 3200);
  }

  function renderCamp(message){
    phase = 'camp';
    overlay.style.background = '';
    const pw = encodePassword();

    const swordCards = SWORDS.map(s=>{
      const owned = ownedSwords.has(s.id);
      const equipped = equippedSwordId===s.id;
      return `<div class="shopcard ${owned?'owned':''} ${equipped?'equipped':''}">
        <h4>${s.name}</h4>
        <div class="stat">Damage ${s.dmg[0]}–${s.dmg[1]} · Range ${s.range} · ${owned? (equipped?'Equipped':'Owned') : ('⛁ '+s.cost)}</div>
        ${equipped ? '' : owned ? `<button data-action="equip-sword" data-id="${s.id}">Equip</button>` : `<button data-action="buy-sword" data-id="${s.id}" ${gold<s.cost?'disabled':''}>Buy &amp; Equip</button>`}
      </div>`;
    }).join('');

    const armorCards = ARMORS.map(a=>{
      const owned = ownedArmor.has(a.id);
      const equipped = equippedArmorId===a.id;
      return `<div class="shopcard ${owned?'owned':''} ${equipped?'equipped':''}">
        <h4>${a.name}</h4>
        <div class="stat">Armor ${a.armor} · ${owned? (equipped?'Equipped':'Owned') : ('⛁ '+a.cost)}</div>
        ${equipped ? '' : owned ? `<button data-action="equip-armor" data-id="${a.id}">Equip</button>` : `<button data-action="buy-armor" data-id="${a.id}" ${gold<a.cost?'disabled':''}>Buy &amp; Equip</button>`}
      </div>`;
    }).join('');

    const unitCards = Object.keys(UNIT_TYPES).map(t=>{
      const ut = UNIT_TYPES[t];
      const owned = ownedUnits[t];
      return `<div class="shopcard ${owned>0?'owned':''}">
        <h4>${ut.label}</h4>
        <div class="stat">HP ${ut.hp} · Dmg ${ut.dmg[0]}–${ut.dmg[1]} · ⛁ ${ut.cost} each<br>In your ranks: <b>${owned}</b></div>
        <button class="small" data-action="buy-unit" data-id="${t}" data-n="1" ${gold<ut.cost?'disabled':''}>+1</button>
        <button class="small" data-action="buy-unit" data-id="${t}" data-n="5" ${gold<ut.cost*5?'disabled':''}>+5</button>
        <button class="small" data-action="buy-unit" data-id="${t}" data-n="10" ${gold<ut.cost*10?'disabled':''}>+10</button>
      </div>`;
    }).join('');

    overlay.innerHTML = `
      <h1 style="font-size:36px">THE PALACE</h1>
      <div class="sub">${message||''}</div>
      <div class="statusrow"><span>⛁ <b>${gold}</b> gold</span></div>

      <div class="sectionLabel">Password</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:flex-start;margin-bottom:10px;">
        <textarea id="pwBoxShop" readonly onclick="this.select()" style="width:340px;max-width:80vw;height:52px;background:rgba(0,0,0,.4);color:var(--bone);border:1px solid rgba(214,138,60,.4);border-radius:4px;padding:8px;font-family:monospace;font-size:11px;">${pw}</textarea>
        <button data-action="copy-password" data-target="pwBoxShop" style="font-family:'Cinzel',serif;font-weight:700;padding:8px 16px;background:rgba(214,138,60,.25);border:1px solid var(--amber);color:var(--bone);border-radius:4px;cursor:pointer;font-size:11.5px;letter-spacing:1px;">Copy</button>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:22px;">
        <input id="pwLoadInputShop" placeholder="Paste a password to load progress..." style="width:300px;max-width:70vw;padding:9px;border-radius:4px;border:1px solid rgba(154,163,171,.4);background:rgba(0,0,0,.35);color:var(--bone);font-family:monospace;font-size:11px;">
        <button data-action="load-password" data-target="pwLoadInputShop" style="font-family:'Cinzel',serif;font-weight:700;padding:8px 16px;background:rgba(90,140,200,.25);border:1px solid #6a9ac9;color:var(--bone);border-radius:4px;cursor:pointer;font-size:11.5px;letter-spacing:1px;">Load</button>
      </div>

      <div class="sectionLabel">Your Sword</div>
      <div class="shopgrid">${swordCards}</div>
      <div class="sectionLabel">Your Armor</div>
      <div class="shopgrid">${armorCards}</div>
      <div class="sectionLabel">Recruit Your Army (no limit — recruit as many as you can afford)</div>
      <div class="shopgrid">${unitCards}</div>

      <button class="bigbtn" data-action="continue-select" style="margin-top:26px;">Return to the Campaign Map</button>
    `;
    overlay.style.display = 'flex';
  }

  // ================= EVENT WIRING =================
  overlay.addEventListener('click', e=>{
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.dataset.action;

    if(action==='view-battle'){ renderBriefing(parseInt(el.dataset.idx)); }
    else if(action==='back-to-select'){ renderSelect(); }
    else if(action==='start-battle'){
      overlay.style.display = 'none';
      buildBattle(parseInt(el.dataset.idx));
      phase = 'battle';
      canvas.requestPointerLock();
    }
    else if(action==='open-camp'){ renderCamp(); }
    else if(action==='continue-select'){ renderSelect(); }
    else if(action==='resume'){
      phase = 'battle';
      overlay.style.display = 'none';
      canvas.requestPointerLock();
    }
    else if(action==='retreat'){ endBattle('retreat'); }
    else if(action==='buy-sword'){
      const s = SWORDS.find(s=>s.id===el.dataset.id);
      if(s && gold>=s.cost){ gold-=s.cost; ownedSwords.add(s.id); equippedSwordId=s.id; currentSword=s; buildSwordMesh(s); renderCamp(); }
    }
    else if(action==='equip-sword'){
      const s = SWORDS.find(s=>s.id===el.dataset.id);
      if(s){ equippedSwordId=s.id; currentSword=s; buildSwordMesh(s); renderCamp(); }
    }
    else if(action==='buy-armor'){
      const a = ARMORS.find(a=>a.id===el.dataset.id);
      if(a && gold>=a.cost){ gold-=a.cost; ownedArmor.add(a.id); equippedArmorId=a.id; currentArmor=a; P.maxArmor=a.armor; renderCamp(); }
    }
    else if(action==='equip-armor'){
      const a = ARMORS.find(a=>a.id===el.dataset.id);
      if(a){ equippedArmorId=a.id; currentArmor=a; P.maxArmor=a.armor; renderCamp(); }
    }
    else if(action==='buy-unit'){
      const t = el.dataset.id, n = parseInt(el.dataset.n);
      const ut = UNIT_TYPES[t];
      const totalCost = ut.cost*n;
      if(gold>=totalCost){ gold-=totalCost; ownedUnits[t]+=n; renderCamp(); }
    }
    else if(action==='copy-password'){ copyPasswordBox(el.dataset.target); }
    else if(action==='load-password'){
      const input = document.getElementById(el.dataset.target);
      const val = input ? input.value : '';
      if(applyPassword(val)){
        if(phase==='select') renderSelect('Password loaded — progress restored.');
        else renderCamp('Password loaded — progress restored.');
      } else {
        if(phase==='select') renderSelect("That password couldn't be read. Check it and try again.");
        else renderCamp("That password couldn't be read. Check it and try again.");
      }
    }
    else if(action==='finale-continue'){
      overlay.style.background = '';
      document.getElementById('hud').style.display = 'none';
      renderCamp(`The empire's rebellion has ended. ${CONSPIRATOR_NAME} is no more, and the palace stands secure once again.`);
    }
  });

  // ================= MAIN LOOP =================
  // Performance optimization: expensive AI/DOM work runs at up to 30 Hz while
  // camera, movement, particles and rendering remain at full frame rate.
  let aiAccumulator = 0;
  let hudAccumulator = 0;
  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(0.05, clock.getDelta());
    if(phase==='battle' && !P.dead){
      updateMovement(dt);
      aiAccumulator += dt;
      if(aiAccumulator >= 0.033){
        const aiDt = aiAccumulator; aiAccumulator = 0;
        updateRebels(aiDt);
        updateArmy(aiDt);
      }
      updateGold(dt);
      updateSwing(dt);
      updateHealthRegen(dt);
      checkWin();
    }
    updateParticles(dt);
    updateProjectiles(dt);
    updateBanner(dt);
    updateHUD();
    renderer.render(scene, camera);
  }

  renderSelect();
  animate();
})();
</script>
</body>
</html>
