<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Assassin of Villagers</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700&display=swap');
  :root{ --iron:#2b2926; --blood:#8a1f1f; --blood-bright:#c73e3e; --amber:#d68a3c; --bone:#e8dcc8; --steel:#9aa3ab; }
  html,body{margin:0;padding:0;overflow:hidden;background:#0b0906;height:100%;}
  canvas{display:block;}
  #hud{ position:fixed; inset:0; pointer-events:none; font-family:'Cinzel',serif; color:var(--bone); text-shadow:0 2px 6px rgba(0,0,0,.9); }
  .crosshair{ position:absolute; top:50%; left:50%; width:22px; height:22px; margin:-11px 0 0 -11px; }
  .crosshair:before, .crosshair:after{ content:''; position:absolute; background:var(--bone); opacity:.85; }
  .crosshair:before{ left:50%; top:0; width:2px; height:100%; margin-left:-1px;}
  .crosshair:after{ top:50%; left:0; height:2px; width:100%; margin-top:-1px;}
  .crosshair.hit:before, .crosshair.hit:after{ background:var(--blood-bright); }
  #drawBar{ position:absolute; top:50%; left:50%; margin:18px 0 0 -30px; width:60px; height:6px; background:rgba(0,0,0,.5); border:1px solid rgba(232,220,200,.4); border-radius:3px; overflow:hidden; display:none;}
  #drawBarFill{ height:100%; width:0%; background:linear-gradient(90deg,#d68a3c,#ffdca0); }
  #interactPrompt{ position:absolute; top:58%; left:50%; transform:translateX(-50%); font-size:14px; letter-spacing:1px; background:rgba(15,12,9,.8); border:1px solid rgba(214,138,60,.5); border-radius:5px; padding:6px 14px; display:none; }
  #hidePrompt{ }
  #topbar{ position:absolute; top:18px; left:0; right:0; display:flex; justify-content:space-between; padding:0 26px; gap:10px; }
  .pill{ background:linear-gradient(180deg, rgba(30,26,20,.85), rgba(15,12,9,.85)); border:1px solid rgba(214,138,60,.4); border-radius:6px; padding:8px 16px; letter-spacing:.5px; }
  .gold{ font-family:'Cinzel Decorative', serif; font-weight:700; color:var(--amber); font-size:20px; }
  .kills{ font-size:13px; }
  .rightpills{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; max-width:64%;}
  #alertPill{ border-color:rgba(199,62,62,.5); }
  #disguisePill{ border-color:rgba(120,170,220,.5); display:none; }
  #bars{ position:absolute; bottom:22px; left:26px; width:260px; }
  .bar-label{ font-size:11px; letter-spacing:2px; text-transform:uppercase; opacity:.8; margin-bottom:3px;}
  .bar-track{ width:100%; height:14px; background:rgba(0,0,0,.55); border:1px solid rgba(232,220,200,.25); border-radius:3px; overflow:hidden; margin-bottom:10px; }
  .bar-fill{ height:100%; transition:width .12s ease-out; }
  #healthFill{ background:linear-gradient(90deg,#5a0f0f,var(--blood-bright)); }
  #armorFill{ background:linear-gradient(90deg,#3a5a6e,#9ecbe0); }
  #staminaFill{ background:linear-gradient(90deg,#8a5a1f,var(--amber)); }
  #vignette{ position:absolute; inset:0; box-shadow:inset 0 0 220px 40px rgba(150,0,0,0); transition:box-shadow .08s; }
  #banner{ position:absolute; top:60px; left:50%; transform:translateX(-50%); font-family:'Cinzel Decorative',serif; font-size:15px; color:var(--blood-bright); letter-spacing:1px; opacity:0; transition:opacity .3s; white-space:nowrap; }
  #overlay{ position:fixed; inset:0; background:radial-gradient(ellipse at center, rgba(30,20,12,.94), rgba(4,3,2,.99)); display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center; font-family:'Cinzel',serif; color:var(--bone); z-index:10; overflow-y:auto; padding:30px 16px; box-sizing:border-box; }
  #overlay h1{ font-family:'Cinzel Decorative',serif; font-size:34px; color:var(--blood-bright); margin:0 0 4px; text-shadow:0 0 30px rgba(199,62,62,.5), 0 4px 0 #000; letter-spacing:1.5px; }
  #overlay .sub{ color:var(--amber); letter-spacing:4px; font-size:12px; margin-bottom:24px; text-transform:uppercase;}
  #overlay .controls{ font-size:13px; line-height:1.9; color:#cfc3ae; margin-bottom:20px; max-width:560px;}
  #overlay .controls b{ color:var(--amber); }
  .bigbtn{ font-family:'Cinzel Decorative',serif; font-size:18px; padding:14px 40px; background:linear-gradient(180deg,var(--blood-bright),var(--blood)); color:var(--bone); border:1px solid rgba(232,220,200,.4); border-radius:4px; cursor:pointer; letter-spacing:2px; box-shadow:0 6px 18px rgba(0,0,0,.5); margin-top:6px; }
  .bigbtn:hover{ filter:brightness(1.15); }
  .bigbtn:disabled{ filter:grayscale(.8) brightness(.6); cursor:not-allowed; }
  #hint{ position:fixed; top:16px; left:50%; transform:translateX(-50%); color:var(--bone); font-family:'Cinzel',serif; font-size:13px; opacity:.75; z-index:5; pointer-events:none; }
  .loadingSpinner{ width:26px; height:26px; border:3px solid rgba(232,220,200,.18); border-top-color:var(--amber); border-radius:50%; animation:spin .85s linear infinite; margin:6px auto 2px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .statusrow{ display:flex; gap:18px; margin-bottom:20px; font-size:12.5px; color:var(--steel); flex-wrap:wrap; justify-content:center;}
  .statusrow b{ color:var(--amber); }
  .sectionLabel{ font-family:'Cinzel Decorative',serif; font-size:13px; color:var(--amber); letter-spacing:2px; text-transform:uppercase; margin:4px 0 12px; }
  .shopgrid{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; max-width:1000px; margin-bottom:20px;}
  .wcard{ width:180px; background:linear-gradient(180deg, rgba(40,32,22,.9), rgba(18,14,10,.92)); border:1px solid rgba(154,163,171,.35); border-radius:8px; padding:12px; text-align:left; }
  .wcard.equipped{ border-color:#8fbf6a; box-shadow:0 0 14px rgba(143,191,106,.25); }
  .wcard h4{ font-family:'Cinzel Decorative',serif; font-size:14px; margin:0 0 5px; color:var(--bone);}
  .wcard .stat{ font-size:10.5px; color:#b8ac96; margin-bottom:2px; }
  .wcard button{ margin-top:9px; width:100%; font-family:'Cinzel',serif; font-weight:700; padding:8px; border-radius:4px; cursor:pointer; background:rgba(214,138,60,.25); border:1px solid var(--amber); color:var(--bone); font-size:11.5px; letter-spacing:1px; }
  .wcard button.owned{ background:rgba(143,191,106,.2); border-color:#8fbf6a; }
  .wcard button:disabled{ background:rgba(80,80,80,.2); border-color:#555; color:#888; cursor:not-allowed; }

  /* ===== Ending sequence ===== */
  #endingFade{ position:fixed; inset:0; background:#000; opacity:0; transition:opacity 3.2s ease; z-index:40; pointer-events:none; }
  #endingScreen{ position:fixed; inset:0; z-index:41; display:none; align-items:center; justify-content:center; overflow:hidden; pointer-events:none; background:transparent; }
  #endingTextWrap{ position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  #endingText{ position:absolute; left:0; right:0; top:100%; text-align:center; font-family:'Cinzel Decorative',serif; color:var(--bone); font-size:26px; line-height:2.4; letter-spacing:1px; text-shadow:0 0 18px rgba(0,0,0,.9), 0 2px 4px #000; padding:0 8vw; box-sizing:border-box; animation:endingCrawl 38s linear forwards; animation-play-state:paused; }
  @keyframes endingCrawl{ from{ top:100%; } to{ top:-140%; } }
</style>
</head>
<body>
<div id="hud" style="display:none">
  <div class="crosshair" id="crosshair"></div>
  <div id="drawBar"><div id="drawBarFill"></div></div>
  <div id="interactPrompt">[E] Open Black Market</div>
  <div id="tentPrompt" style="position:absolute; top:58%; left:50%; transform:translateX(-50%); font-size:14px; letter-spacing:1px; background:rgba(15,12,9,.8); border:1px solid rgba(120,170,220,.5); border-radius:5px; padding:6px 14px; display:none;">[E] Contracts</div>
  <div id="loiterPrompt">Villagers are alarmed — the guard countdown is active</div>
  <div id="hidePrompt" style="position:absolute; top:74%; left:50%; transform:translateX(-50%); font-size:13px; letter-spacing:.5px; text-align:center; color:var(--bone); background:rgba(15,12,9,.85); border:1px solid rgba(214,138,60,.5); border-radius:5px; padding:6px 14px; display:none;"></div>
  <div id="topbar">
    <div class="pill gold">⛁ <span id="goldCount">0</span> gold</div>
    <div class="rightpills">
      <div class="pill kills" id="weaponPill">🔪 Rusty Knife</div>
      <div class="pill kills" id="disguisePill">🎭 Disguised</div>
      <div class="pill kills" id="alertPill">⚠ Alert 0</div>
      <div class="pill kills" id="missionPill" style="display:none">📜 Contracts 0</div>
      <div class="pill kills" id="toolsPill" style="display:none">💨 x0 · 🔪 x0</div>
      <div class="pill kills">Kills: <span id="killCount">0</span></div>
    </div>
  </div>
  <canvas id="minimap" width="150" height="150" style="position:absolute; top:98px; right:26px; border:2px solid rgba(214,138,60,.55); border-radius:8px; background:rgba(10,8,6,.6); display:none;"></canvas>
  <div id="banner"></div>
  <div id="bossHealthWrap" style="position:absolute; top:16px; left:50%; transform:translateX(-50%); width:380px; text-align:center; display:none;">
    <div class="bar-label" id="bossHealthLabel" style="color:#e6b0b0;">Target</div>
    <div class="bar-track" style="border-color:rgba(199,62,62,.45);"><div class="bar-fill" id="bossHealthFill" style="width:100%; background:linear-gradient(90deg,#6b0f0f,#c73e3e);"></div></div>
  </div>
  <div id="bars">
    <div class="bar-label">Health</div>
    <div class="bar-track"><div class="bar-fill" id="healthFill" style="width:100%"></div></div>
    <div class="bar-label">Stamina</div>
    <div class="bar-track"><div class="bar-fill" id="staminaFill" style="width:100%"></div></div>
  </div>
</div>
<div id="vignette"></div>
<div id="hint" style="display:none">Esc pause · E black market / contracts</div>
<div id="overlay"></div>
<div id="endingFade"></div>
<div id="endingScreen">
  <div id="endingTextWrap"><div id="endingText"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const GUARD_TYPES = {
    sentry:    { label:'Guard',     hpMult:1.00, dmgMult:1.00, speedMult:1.00, range:2.3,  ranged:false, atkCooldown:1.3 },
    spear:     { label:'Spearman',  hpMult:1.05, dmgMult:1.15, speedMult:0.95, range:3.0,  ranged:false, atkCooldown:1.1 },
    archer:    { label:'Archer',    hpMult:0.75, dmgMult:0.85, speedMult:1.05, range:16,   ranged:true,  atkCooldown:1.7 },
    berserker: { label:'Berserker', hpMult:1.65, dmgMult:1.40, speedMult:1.15, range:2.6,  ranged:false, atkCooldown:1.6 },
  };
  const BASE_GUARD_HP = 150, BASE_GUARD_DMG = [8,14], BASE_GUARD_SPEED = 5.4;

  const WEAPONS = [
    { id:'rusty', name:'Rusty Kitchen Knife', type:'melee', cost:0, dmg:[30,46], range:2.6, cooldown:.42, arc:46, bladeColor:0x9a8f7c, glow:0 },
    { id:'iron', name:'Iron Dagger', type:'melee', cost:120, dmg:[42,60], range:2.8, cooldown:.38, arc:48, bladeColor:0xb9bec4, glow:0 },
    // Lower up-front damage than the Shadow Fang, but a hit smears on a
    // poison that ticks for real damage over several seconds — expensive,
    // but devastating against tanky targets you can keep landing hits on.
    { id:'poison', name:'Poisoned Stiletto', type:'melee', cost:520, dmg:[38,54], range:2.9, cooldown:.34, arc:50, bladeColor:0x5a8a4f, glow:0.3,
      poisonDot:{dps:18, duration:6} },
    { id:'shadow', name:'Shadow Fang', type:'melee', cost:420, dmg:[75,105], range:3.0, cooldown:.30, arc:52, bladeColor:0x2a1a33, glow:0.6 },
  ];
  const ownedWeapons = new Set(['rusty']);
  let equippedWeaponId = 'rusty';
  let equippedBowId = null;

  // ================= ASSASSIN TOOLS =================
  let smokeBombs = 0;
  let throwingKnives = 0;
  let ownedMap = false;
  const SMOKE_BOMB_PACK = 3, SMOKE_BOMB_COST = 150;
  const THROW_KNIFE_PACK = 5, THROW_KNIFE_COST = 150;
  const MAP_COST = 150;
  const THROW_KNIFE_DMG = [35,50], THROW_KNIFE_RANGE = 26;

  // The assassin never takes off the disguise — it only slips for a short
  // window right after you draw blood, which is when a nearby guard can
  // actually recognize you.
  let disguiseBrokenUntil = 0;
  function isDisguised(){
    return (performance.now()/1000) > disguiseBrokenUntil;
  }
  function breakDisguise(){
    disguiseBrokenUntil = performance.now()/1000 + 15;
  }

  let gold = 0;

  // ================= THREE SETUP =================
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d0f16);
  scene.fog = new THREE.Fog(0x0d0f16, 46, 180);

  const renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:'high-performance', stencil:false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  // Capping pixel ratio keeps frame times sane on high-DPI (retina/4K) displays,
  // which otherwise force the GPU to shade several times more pixels than needed.
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.0));
  // No shadows: a war-ravaged city at night reads better with flat, readable
  // lighting than with shadow-map noise, and it keeps the frame rate steady.
  renderer.shadowMap.enabled = false;
  document.body.appendChild(renderer.domElement);

  const CAMERA_DEFAULT_FOV = 75;
  const BOW_AIM_FOV = 45;
  let targetCameraFov = CAMERA_DEFAULT_FOV;
  const camera = new THREE.PerspectiveCamera(CAMERA_DEFAULT_FOV, innerWidth/innerHeight, 0.1, 210);
  const EYE_HEIGHT = 1.7;
  const player = new THREE.Object3D();
  // No horse in the ruined city — the assassin moves on foot, unseen.
  let horse = null;
  let horseOwned = false;
  let horseMounted = false;
  const HORSE_COST = 999999;
  player.add(camera);
  camera.position.set(0, EYE_HEIGHT, 0);
  scene.add(player);

  window.addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.0));
  });

  // ================= 24-MINUTE DAY / NIGHT CYCLE =================
  // A full in-game day is 24 real minutes: 12 minutes of daylight + 12 minutes of night.
  // The cycle starts at dawn, with the sun just above the ocean horizon to the east.
  const DAY_LENGTH = 24 * 60;
  const DAYLIGHT_LENGTH = 12 * 60;
  let worldTime = 0; // seconds since dawn; intentionally starts at dawn every new game
  let dayNumber = 1;

  const ambient = new THREE.AmbientLight(0x5a6170, 0.48);
  scene.add(ambient);
  const sunLight = new THREE.DirectionalLight(0xffd1a0, 1.0);
  sunLight.castShadow = false;
  scene.add(sunLight);

  const nightLight = new THREE.DirectionalLight(0x9fb0ff, 0.18);
  nightLight.position.set(-50, 70, -30);
  scene.add(nightLight);

  // Dynamic sky dome: warm red/orange around the rising/setting sun, brighter blue overhead,
  // and a deliberately readable (not pitch-black) night.
  const skyUniforms = {
    sunDir: { value: new THREE.Vector3(1, 0.03, 0).normalize() },
    daylight: { value: 0.02 },
    glow: { value: 1.0 }
  };
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: skyUniforms,
    vertexShader: `
      varying vec3 vWorldDir;
      void main(){
        vec4 wp = modelMatrix * vec4(position,1.0);
        vWorldDir = normalize(wp.xyz - cameraPosition);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      }`,
    fragmentShader: `
      uniform vec3 sunDir;
      uniform float daylight;
      uniform float glow;
      varying vec3 vWorldDir;
      void main(){
        vec3 d = normalize(vWorldDir);
        float h = clamp(d.y * 0.5 + 0.5, 0.0, 1.0);
        vec3 nightHorizon = vec3(0.055,0.065,0.10);
        vec3 nightZenith  = vec3(0.015,0.025,0.055);
        vec3 dayHorizon   = vec3(0.92,0.38,0.20);
        vec3 dayZenith    = vec3(0.30,0.58,0.88);
        vec3 skyDay = mix(dayHorizon, dayZenith, smoothstep(0.18,0.95,h));
        vec3 skyNight = mix(nightHorizon, nightZenith, smoothstep(0.05,0.95,h));
        vec3 col = mix(skyNight, skyDay, daylight);
        float sunDot = max(dot(d, normalize(sunDir)), 0.0);
        float horizonSun = exp(-pow(max(sunDir.y,0.0) * 2.2, 2.0));
        float sunGlow = pow(sunDot, 10.0) * 0.45 + pow(sunDot, 70.0) * 0.8;
        float redGlow = pow(sunDot, 3.0) * 0.55 * (0.35 + 0.65*horizonSun) * glow;
        col += vec3(1.0,0.24,0.08) * redGlow;
        col += vec3(1.0,0.68,0.30) * sunGlow * (0.45 + 0.55*daylight);
        gl_FragColor = vec4(col,1.0);
      }`
  });
  const skyDome = new THREE.Mesh(new THREE.SphereGeometry(1000,32,16), skyMat);
  skyDome.frustumCulled = false;
  scene.add(skyDome);

  // Small glowing sun disc, kept above the ocean horizon at dawn.
  const sunCanvas = document.createElement('canvas');
  sunCanvas.width = sunCanvas.height = 128;
  const sunCtx = sunCanvas.getContext('2d');
  const sunGrad = sunCtx.createRadialGradient(64,64,4,64,64,60);
  sunGrad.addColorStop(0,'rgba(255,250,210,1)');
  sunGrad.addColorStop(.22,'rgba(255,220,120,.95)');
  sunGrad.addColorStop(.55,'rgba(255,120,45,.38)');
  sunGrad.addColorStop(1,'rgba(255,70,20,0)');
  sunCtx.fillStyle=sunGrad; sunCtx.fillRect(0,0,128,128);
  const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(sunCanvas),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
  sunSprite.scale.set(38,38,1);
  scene.add(sunSprite);

  const DAY_LABEL = document.createElement('div');
  DAY_LABEL.id='dayTimePill';
  DAY_LABEL.className='pill kills';
  DAY_LABEL.style.position='absolute';
  DAY_LABEL.style.top='72px';
  DAY_LABEL.style.left='26px';
  DAY_LABEL.style.zIndex='3';
  DAY_LABEL.textContent='DAY 1 • DAWN';
  document.body.appendChild(DAY_LABEL);

  function updateDayNight(dt){
    worldTime += dt;
    if(worldTime >= DAY_LENGTH){ worldTime -= DAY_LENGTH; dayNumber++; }

    // 0 = dawn on the ocean horizon, 0.5 = sunset on the opposite horizon.
    const phase = worldTime / DAY_LENGTH;
    const daylightRaw = worldTime < DAYLIGHT_LENGTH ? worldTime / DAYLIGHT_LENGTH : 0;
    // Smooth sunrise and sunset transitions without making the night pitch black.
    const daylight = worldTime < DAYLIGHT_LENGTH
      ? Math.sin(Math.PI * (worldTime / DAYLIGHT_LENGTH))
      : 0;

    // Sun makes a full half-orbit during the 12-minute daylight period.
    // +X is the ocean side, so dawn begins directly over the ocean.
    const dayT = Math.min(1, worldTime / DAYLIGHT_LENGTH);
    const angle = -Math.PI * 0.02 + Math.PI * dayT;
    const sunY = Math.sin(angle);
    const sunX = Math.cos(angle);
    const sunZ = Math.sin(angle * 0.28) * 0.18;
    const sunDir = new THREE.Vector3(sunX, Math.max(0.025, sunY), sunZ).normalize();
    skyUniforms.sunDir.value.copy(sunDir);
    skyUniforms.daylight.value = daylight;
    skyUniforms.glow.value = 0.65 + 0.35 * (1-daylight);

    // Keep the visible sun over/near the ocean at dawn, then arc overhead and toward the city.
    sunSprite.position.copy(sunDir).multiplyScalar(520);
    sunSprite.visible = sunY > -0.08;

    sunLight.position.copy(sunDir).multiplyScalar(180);
    sunLight.intensity = 0.10 + daylight * 1.05;
    sunLight.color.setHSL(0.08, 0.65, 0.48 + daylight*0.10);

    ambient.intensity = 0.28 + daylight * 0.40;
    nightLight.intensity = 0.14 + (1-daylight) * 0.10;

    // The sky shader supplies the actual color; fog follows it so distant terrain doesn't pop.
    const fogDay = new THREE.Color(0x8aa6c2);
    const fogDawn = new THREE.Color(0x8f4b35);
    const fogNight = new THREE.Color(0x182039);
    let fogColor;
    if(worldTime < DAYLIGHT_LENGTH){
      const dawnBlend = Math.min(1, worldTime/150);
      fogColor = fogDawn.clone().lerp(fogDay, daylight).lerp(fogDay, dawnBlend*0.35);
    } else {
      fogColor = fogNight.clone().lerp(fogDawn, Math.max(0, 1-(worldTime-DAYLIGHT_LENGTH)/150));
    }
    scene.fog.color.copy(fogColor);

    const totalMinutes = Math.floor((worldTime / 60) % 24);
    const mins = String(totalMinutes).padStart(2,'0');
    let label = 'DAWN';
    if(worldTime >= 120 && worldTime < 300) label='MORNING';
    else if(worldTime >= 300 && worldTime < 540) label='DAY';
    else if(worldTime >= 540 && worldTime < 720) label='SUNSET';
    else if(worldTime >= 720 && worldTime < 900) label='NIGHT';
    else if(worldTime >= 900 && worldTime < 1200) label='NIGHT';
    else if(worldTime >= 1200) label='PRE-DAWN';
    DAY_LABEL.textContent = `DAY ${dayNumber} • ${label} • ${mins}:00`;
  }
  updateDayNight(0);

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(2400,2400), new THREE.MeshStandardMaterial({ color: 0x445536, roughness:1 }));
  ground.rotation.x = -Math.PI/2; ground.receiveShadow = true;
  scene.add(ground);

  const WORLD_BOUND = 320;

  // ================= KNIFE (first person melee weapon) =================
  const sword = new THREE.Group();
  const GRIP_LEN = 0.16, BLADE_LEN = 0.34;
  const grip = new THREE.Mesh(new THREE.CylinderGeometry(.034,.04,GRIP_LEN,8), new THREE.MeshStandardMaterial({color:0x2e2013, roughness:.85}));
  grip.rotation.x = Math.PI/2; grip.position.z = -GRIP_LEN/2;
  sword.add(grip);
  const pommel = new THREE.Mesh(new THREE.SphereGeometry(.05,8,6), new THREE.MeshStandardMaterial({color:0x8a8f94, metalness:.7, roughness:.3}));
  pommel.position.z = 0.03;
  sword.add(pommel);
  const crossguard = new THREE.Mesh(new THREE.BoxGeometry(.34,.05,.06), new THREE.MeshStandardMaterial({color:0x8a8f94, metalness:.7, roughness:.3}));
  crossguard.position.z = -GRIP_LEN;
  sword.add(crossguard);
  const bladeMat = new THREE.MeshStandardMaterial({color:0x9a8f7c, metalness:.75, roughness:.25, emissive:0x000000, emissiveIntensity:0});

  function recolorMesh(mesh, swaps){
    mesh.traverse(o=>{
      if(o.isMesh && o.material && o.material.color){
        const hex = o.material.color.getHex();
        const hit = swaps.find(([from])=>from===hex);
        if(hit) o.material.color.setHex(hit[1]);
      }
    });
  }

  function updateKingBoss(dt){
    if(!kingBoss || kingBoss.dead) return;
    // Phase transition, once: at half health he calls in his Royal Guard.
    if(!kingReinforcementsSummoned && kingBoss.hp <= kingBoss.maxHp*0.5){
      kingReinforcementsSummoned = true;
      showBanner('THE KING CALLS HIS ROYAL GUARD!');
      sfx('alert');
      for(let i=0;i<3;i++){
        const ang = (i/3)*Math.PI*2;
        const gx = kingBoss.mesh.position.x + Math.cos(ang)*6, gz = kingBoss.mesh.position.z + Math.sin(ang)*6;
        const gm = makeGuard('spear');
        recolorMesh(gm, [[0x6b1f1f,0x7a1f1f]]);
        gm.position.set(gx,0,gz);
        scene.add(gm);
        const gt = GUARD_TYPES.spear;
        villagers.push({
          mesh: gm, isGuard:true, type:'spear', hp: BASE_GUARD_HP*gt.hpMult*1.3, maxHp: BASE_GUARD_HP*gt.hpMult*1.3,
          dmgRange:[BASE_GUARD_DMG[0]*gt.dmgMult*1.2, BASE_GUARD_DMG[1]*gt.dmgMult*1.2], speed: BASE_GUARD_SPEED*gt.speedMult,

          state:'attack', hasAlerted:true, dead:false, fallProgress:0,
          leashPos:new THREE.Vector3(0,0,0), leashRadius:78
        });

    }
    // A ranged "Royal Judgment" bolt keeps the fight honest against pure
    // kiting — he can still hurt you at range, just on a real cooldown.
    // Same vertical rule as everyone else: get high enough above him and
    // even this can't reach you.
    if(player.position.y - kingBoss.mesh.position.y > VERTICAL_SIGHT_LIMIT) return;
    const dist = Math.hypot(player.position.x-kingBoss.mesh.position.x, player.position.z-kingBoss.mesh.position.z);
    kingSpecialTimer -= dt;
    if(kingSpecialTimer<=0 && dist > kingBoss.range+2 && !P.dead){
      kingSpecialTimer = 4.5;
      const sh = kingBoss.mesh.position.clone(); sh.y += 1.7;
      const tp = player.position.clone(); tp.y += 1.2;
      spawnArrowProjectile(sh, tp, 0xffd876, null, 0);
      hurtPlayer(28 + Math.random()*14, true);
      sfx('hit');
    }
  }

  function makeLooter(){
    // A ragged squatter/deserter — reuses the civilian silhouette with a
    // grimier palette and a small cleaver so it reads as hostile at a glance.
    const g = makeVillagerCiv();
    g.traverse(o=>{
      if(o.isMesh && o.material && o.material.color){
        const c = o.material.color.getHex();
        if(c===0x7a6a4f||c===0x4f6a4f||c===0x6a4f4f||c===0x5a5a70) o.material.color.setHex(0x33291f);
      }
    });
    const cleaver = new THREE.Mesh(new THREE.BoxGeometry(.07,.28,.02), new THREE.MeshStandardMaterial({color:0x8a8f94, metalness:.6}));
    cleaver.position.set(.5,1.05,0);
    g.add(cleaver);
    return g;
  }

  function checkMissionProgress(v){
    if(v.isBountyTarget){
      const m = MISSIONS.find(m=>m.id===v.missionId);
      if(m && m.status==='active'){
        m.status='ready';
        showBanner('CONTRACT COMPLETE — RETURN TO THE TENT');
        updateMissionHUD();
      }
      return;
    }
    if(v.isPurgeTarget){
      const m = MISSIONS.find(m=>m.id===v.missionId);
      if(m && m.status==='active'){
        m.progress++;
        if(m.progress>=m.required){ m.status='ready'; showBanner('RUINS CLEARED — RETURN TO THE TENT'); }
        updateMissionHUD();
      }
      return;
    }
  }

  function updateMissionHUD(){
    const pill = document.getElementById('missionPill');
    if(!pill) return;
    const active = activeMissionCount();
    if(active>0){ pill.style.display='inline-block'; pill.textContent = `📜 Contracts ${active}/${MAX_ACTIVE_MISSIONS}`; }
    else pill.style.display='none';
  }

  const MAX_ACTIVE_MISSIONS = 3;
  function activeMissionCount(){
    return MISSIONS.filter(m=>m.status==='active'||m.status==='ready').length;
  }

  function acceptMission(id){
    const m = MISSIONS.find(m=>m.id===id);
    if(!m || m.status!=='available') return;
    if(activeMissionCount() >= MAX_ACTIVE_MISSIONS){
      showBanner(`CONTRACT LIMIT REACHED (${MAX_ACTIVE_MISSIONS}) — TURN ONE IN FIRST`);
      return;
    }
    m.status='active';
    if(m.type==='bounty') spawnBountyTarget(m);
    else if(m.type==='purge'){
      const village = VILLAGES.find(v=>v.id===m.villageId);
      if(village) for(let i=0;i<m.required;i++) spawnPurgeTarget(m, village);
    }
    updateMissionHUD();
  }

  function turnInMission(id){
    const m = MISSIONS.find(m=>m.id===id);
    if(!m || m.status!=='ready') return;
    gold += m.reward;
    document.getElementById('goldCount').textContent = gold;
    m.status='done';
    showBanner(`+${m.reward} GOLD — CONTRACT COMPLETE`);
    updateMissionHUD();
    if(allMissionsComplete() && !kingSpawned) spawnKingOfVillagers();
  }

  // Dying voids any contract that hasn't been turned in yet — bounty targets
  // are removed from the world and purge progress resets to zero.
  function cancelActiveMissions(){
    let changed=false;
    MISSIONS.forEach(m=>{
      if(m.status==='active' || m.status==='ready'){
        changed=true;
        if(m.type==='bounty' && m.targetRef && !m.targetRef.dead){
          scene.remove(m.targetRef.mesh);
          const idx = villagers.indexOf(m.targetRef);
          if(idx>=0) villagers.splice(idx,1);
        }
        if(m.type==='purge'){
          for(let i=villagers.length-1;i>=0;i--){
            if(villagers[i].isPurgeTarget && villagers[i].missionId===m.id && !villagers[i].dead){
              scene.remove(villagers[i].mesh);
              villagers.splice(i,1);
            }
          }
          m.progress = 0;
        }
        m.targetRef = null;
        m.status='available';
      }
    });
    if(changed){ updateMissionHUD(); showBanner('CONTRACTS CANCELLED'); }
  }

  function addWaterBarrier(){
    // Previously placed an invisible wall a couple of units before the beach,
    // which blocked the player from ever reaching the shore or ocean at all.
    // The ocean is meant to be enterable — the general WORLD_BOUND clamp is
    // the only limit now, so this is intentionally a no-op.
  }

  function buildCity(){
    let torchCount = 0;
    // collect window/door transforms, build as InstancedMesh afterward for performance
    const winZ = [], winX = [], doors = [];
    for(let i=-CITY_HALF;i<=CITY_HALF;i++){
      for(let j=-CITY_HALF;j<=CITY_HALF;j++){
        if(i>=-2 && i<=1 && j>=-2 && j<=1) continue;
        const cx = i*BLOCK + (Math.random()-0.5)*2, cz = j*BLOCK + (Math.random()-0.5)*2;
        // Fewer, grander buildings than a dense city grid — a big timber
        // village, not a skyline. A rare "hall" plot is built wider still,
        // as a landmark among the ordinary houses.
        const grand = Math.random() < 0.14;
        const w = (grand ? 15 : 9) + Math.random()*5, d = (grand ? 14 : 9) + Math.random()*5;
        const rawH = (grand ? 8.5 : 5.5) + Math.random()*(grand?4:6.5);
        // About a third of buildings get a flat, walkable rooftop with a low
        // parapet instead of a pitched roof — somewhere to climb up, land,
        // and hide above the streets. A rooftop only works as a hiding spot
        // if it clears the vertical sight limit guards lose you past, so
        // short plots get bumped up a bit when they roll one.
        const flatRoof = Math.random() < 0.32;
        const h = flatRoof ? Math.max(rawH, 7.3) : rawH;
        const color = buildingPalette[Math.floor(Math.random()*buildingPalette.length)];
        const bld = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshStandardMaterial({color, roughness:.88}));
        bld.position.set(cx, h/2, cz);
        bld.castShadow = true; bld.receiveShadow = true;
        scene.add(bld);
        let roofY = null;
        if(flatRoof){
          const deckH = 0.4, rw = w*0.94, rd = d*0.94;
          roofY = h + deckH;
          const deck = new THREE.Mesh(new THREE.BoxGeometry(rw, deckH, rd), new THREE.MeshStandardMaterial({color:0x746a58, roughness:.95}));
          deck.position.set(cx, h+deckH/2, cz);
          deck.castShadow = true; deck.receiveShadow = true;
          scene.add(deck);
          // A low parapet trim around the edge — cover to crouch behind and
          // a visual cue that this roof is meant to be stood on.
          const parapetH = 0.55, parapetT = 0.22;
          const pMat = new THREE.MeshStandardMaterial({color:0x5c5346, roughness:.9});
          const pN = new THREE.Mesh(new THREE.BoxGeometry(rw, parapetH, parapetT), pMat); pN.position.set(cx, roofY+parapetH/2, cz-rd/2); scene.add(pN);
          const pS = new THREE.Mesh(new THREE.BoxGeometry(rw, parapetH, parapetT), pMat); pS.position.set(cx, roofY+parapetH/2, cz+rd/2); scene.add(pS);
          const pE = new THREE.Mesh(new THREE.BoxGeometry(parapetT, parapetH, rd), pMat); pE.position.set(cx+rw/2, roofY+parapetH/2, cz); scene.add(pE);
          const pW = new THREE.Mesh(new THREE.BoxGeometry(parapetT, parapetH, rd), pMat); pW.position.set(cx-rw/2, roofY+parapetH/2, cz); scene.add(pW);
          flatRoofs.push({x:cx, z:cz, halfW: rw/2, halfD: rd/2, y: roofY});
        } else {
          // A steep pitched roof — the single biggest change that makes this
          // read as a village instead of a block of cubes.
          const roofH = (grand ? 4.2 : 2.6) + Math.random()*2.0;
          const roofColor = roofPalette[Math.floor(Math.random()*roofPalette.length)];
          const roof = new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*0.72, roofH, 4), new THREE.MeshStandardMaterial({color:roofColor, roughness:.85}));
          roof.position.set(cx, h+roofH/2-0.15, cz);
          roof.rotation.y = Math.PI/4;
          scene.add(roof);
        }
        // corner-safe collision circle (covers the full rectangular footprint, including corners)
        // Flat-roof buildings are tagged with roofY so the collision push
        // stands down once the player is up on the deck instead of pinning
        // them to the walls below.
        obstacles.push({x:cx, z:cz, radius: Math.sqrt((w/2)*(w/2)+(d/2)*(d/2)) + 0.35, roofY});

        if((i*7+j*13+31) % 7 === 0 && torchCount < 18){
          torchCount++;
          const torch = new THREE.PointLight(0xff9a4a, 1.1, 14, 2);
          torch.position.set(cx + w/2 + 0.3, 3.2, cz);
          scene.add(torch);
          const bracket = new THREE.Mesh(new THREE.BoxGeometry(.15,.15,.4), new THREE.MeshStandardMaterial({color:0x2b2926}));
          bracket.position.set(cx + w/2 + 0.15, 3.2, cz);
          scene.add(bracket);
        }

        // windows
        const floors = Math.min(5, Math.max(1, Math.round(h/4.2)));
        for(let f=0; f<floors; f++){
          const wy = 1.7 + f*3.6;
          if(wy > h-1) break;
          const winsW = Math.min(4, Math.max(1, Math.round(w/3.6)));
          for(let k=0;k<winsW;k++){
            if(Math.random()<0.22) continue;
            const wx = -w/2 + (k+0.5)*(w/winsW);
            winZ.push([cx+wx, wy, cz+d/2+0.03]);
            winZ.push([cx+wx, wy, cz-d/2-0.03]);
          }
          const winsD = Math.min(4, Math.max(1, Math.round(d/3.6)));
          for(let k=0;k<winsD;k++){
            if(Math.random()<0.22) continue;
            const wz = -d/2 + (k+0.5)*(d/winsD);
            winX.push([cx+w/2+0.03, wy, cz+wz]);
            winX.push([cx-w/2-0.03, wy, cz+wz]);
          }
        }
        // door on the -Z face
        doors.push([cx, 1.1, cz - d/2 - 0.04]);
      }
    }

    // instanced windows (2 draw calls total regardless of city size)
    if(winZ.length){
      const winZMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.9,1.1,0.06), new THREE.MeshStandardMaterial({color:0xffdca0, emissive:0xffcf7a, emissiveIntensity:0.85}), winZ.length);
      const d1 = new THREE.Object3D();
      winZ.forEach((p,idx)=>{ d1.position.set(p[0],p[1],p[2]); d1.updateMatrix(); winZMesh.setMatrixAt(idx, d1.matrix); });
      winZMesh.instanceMatrix.needsUpdate = true;
      scene.add(winZMesh);
    }
    if(winX.length){
      const winXMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.06,1.1,0.9), new THREE.MeshStandardMaterial({color:0xffdca0, emissive:0xffcf7a, emissiveIntensity:0.85}), winX.length);
      const d2 = new THREE.Object3D();
      winX.forEach((p,idx)=>{ d2.position.set(p[0],p[1],p[2]); d2.updateMatrix(); winXMesh.setMatrixAt(idx, d2.matrix); });
      winXMesh.instanceMatrix.needsUpdate = true;
      scene.add(winXMesh);
    }
    if(doors.length){
      const doorMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1.3,2.2,0.08), new THREE.MeshStandardMaterial({color:0x2e2013, roughness:.85}), doors.length);
      const d3 = new THREE.Object3D();
      doors.forEach((p,idx)=>{ d3.position.set(p[0],p[1],p[2]); d3.updateMatrix(); doorMesh.setMatrixAt(idx, d3.matrix); });
      doorMesh.instanceMatrix.needsUpdate = true;
      scene.add(doorMesh);
    }

    // paved city floor
    const cityFloor = new THREE.Mesh(new THREE.PlaneGeometry(CITY_EXTENT*2, CITY_EXTENT*2), new THREE.MeshStandardMaterial({color:0x5c5344, roughness:1}));
    cityFloor.rotation.x = -Math.PI/2; cityFloor.position.y = 0.02; cityFloor.receiveShadow = true;
    scene.add(cityFloor);

    // lamp posts + wells at a sample of street intersections
    let lampCount=0, wellCount=0;
    for(let i=-CITY_HALF;i<CITY_HALF;i+=2){
      for(let j=-CITY_HALF;j<CITY_HALF;j+=2){
        const ix = i*BLOCK+BLOCK/2, iz = j*BLOCK+BLOCK/2;
        if(Math.hypot(ix,iz) < 10) continue;
        const r = Math.abs((i*11+j*17+5))%10;
        if(r<4 && lampCount<22){ lampCount++; buildLampPost(ix,iz); }
        else if(r===7 && wellCount<10){ wellCount++; buildWell(ix,iz); }
      }
    }

  }

  function buildWizardTower(){

    const black=new THREE.MeshStandardMaterial({color:0x0c0c10,roughness:.72,metalness:.2});
    const darkStone=new THREE.MeshStandardMaterial({color:0x18171d,roughness:.92});

    // Lower the tower 1 unit and leave a real opening through the foundation.
    const wallThetaStart = TOWER_DOOR_ANGLE + TOWER_DOOR_GAP/2;
    const wallThetaLength = Math.PI*2 - TOWER_DOOR_GAP;
    const baseGeo = new THREE.CylinderGeometry(14.5,17,2.4,20,1,true,wallThetaStart,wallThetaLength);
    const base=new THREE.Mesh(baseGeo,darkStone);
    base.position.set(x,y0+1.2,z); base.castShadow=true; base.receiveShadow=true; scene.add(base);
    // Solid tapering keep wall with the same doorway opening as the foundation.
    const wallGeo = new THREE.CylinderGeometry(11.4,13.8,h,44,1,true,wallThetaStart,wallThetaLength);
    const wall = new THREE.Mesh(wallGeo, black);
    wall.position.set(x,y0+h/2,z); wall.castShadow=true; wall.receiveShadow=true; scene.add(wall);
    towerWallMesh = wall;
    // Faint stone banding rings up the shaft break up the height without opening any gaps.
    for(let i=2;i<6;i++){
      const ringY = y0 + (h*i/6);
      const ringR = 11.4 + (13.8-11.4)*(1-i/6) + .12;
      const ring = new THREE.Mesh(new THREE.TorusGeometry(ringR,.24,6,48,wallThetaLength), trimStone);
      ring.rotation.x = Math.PI/2; ring.rotation.z = wallThetaStart;
      ring.position.set(x,ringY,z); scene.add(ring);
    }
    // Visible platform floor: previously the tower's wall was a hollow open-ended
    // cylinder with no cap at the top, so there was nothing solid to actually

    // floor, sized to match the full walkable area on top of the tower.

    platformFloor.position.set(x, y0+h-0.2, z); platformFloor.castShadow=true; platformFloor.receiveShadow=true; scene.add(platformFloor);
    // Low open parapet around the edge gives the rooftop a finished silhouette
    // from outside without capping the arena — the platform stays open to the
    // sky so the flying wizard boss is always visible during the fight.
    const parapet = new THREE.Mesh(new THREE.CylinderGeometry(12.3,12.5,0.9,32,1,true), darkStone);
    parapet.position.set(x, y0+h+0.45, z); parapet.castShadow=true; parapet.receiveShadow=true; scene.add(parapet);
    // Opening in the platform floor at the top of the spiral stairs. The black inset
    // reads as a real hole and sits flush with the platform, directly over the
    // staircase endpoint, so the player can see where they climbed up from.
    const stairTopA=TOWER_DOOR_ANGLE + (TOWER_STAIR_TURNS*Math.PI*2);
    const holeX=x+Math.cos(stairTopA)*TOWER_STAIR_RADIUS;
    const holeZ=z+Math.sin(stairTopA)*TOWER_STAIR_RADIUS;
    const roofHole=new THREE.Mesh(
      new THREE.CylinderGeometry(2.15,2.15,.08,24),
      new THREE.MeshBasicMaterial({color:0x020107,side:THREE.DoubleSide})
    );
    roofHole.position.set(holeX,y0+h+0.06,holeZ); scene.add(roofHole);
    const roofHoleRim=new THREE.Mesh(
      new THREE.TorusGeometry(2.15,.13,8,28),

    );
    roofHoleRim.rotation.x=Math.PI/2;
    roofHoleRim.position.set(holeX,y0+h+0.1,holeZ); roofHoleRim.castShadow=true; scene.add(roofHoleRim);


    // Distinctive exterior entrance: no bulky rim, with a recessed arcane double door.
    const doorMat=new THREE.MeshStandardMaterial({color:0x11101a,roughness:.58,metalness:.42});
    const doorPanelMat=new THREE.MeshStandardMaterial({color:0x282238,roughness:.5,metalness:.5});
    const doorGlowMat=new THREE.MeshBasicMaterial({color:0xb98cff});
    const doorway=new THREE.Mesh(new THREE.BoxGeometry(4.8,6.0,.30),doorMat);
    doorway.position.set(x,y0+3.0,z-13.02); doorway.castShadow=true; doorway.receiveShadow=true; scene.add(doorway);
    // Split door leaves with a visible center seam and raised panels.
    [-1.18,1.18].forEach(dx=>{
      const panel=new THREE.Mesh(new THREE.BoxGeometry(2.18,5.15,.16),doorPanelMat);
      panel.position.set(x+dx,y0+2.8,z-13.28); panel.castShadow=true; scene.add(panel);
      const rune=new THREE.Mesh(new THREE.TorusGeometry(.72,.055,6,16),doorGlowMat);
      rune.position.set(x+dx,y0+3.0,z-13.39); rune.rotation.x=Math.PI/2; scene.add(rune);
    });
    const doorFrameMat=new THREE.MeshStandardMaterial({color:0x4a3d61,roughness:.62,metalness:.38});
    [-2.7,2.7].forEach(dx=>{
      const jamb=new THREE.Mesh(new THREE.BoxGeometry(.42,5.8,.72),doorFrameMat);
      jamb.position.set(x+dx,y0+2.9,z-12.82); jamb.castShadow=true; jamb.receiveShadow=true; scene.add(jamb);
    });
    // Clean arched frame: use a half-ring aligned directly with the exterior face.
    // No sideways torus/horn geometry.
    const arch=new THREE.Mesh(new THREE.TorusGeometry(2.65,.16,7,32,Math.PI),doorFrameMat);
    arch.rotation.x=Math.PI/2;
    arch.position.set(x,y0+5.65,z-13.02); arch.castShadow=true; scene.add(arch);
    // Entrance floor is completely flush — no lower rim or threshold.

    doorGlow.position.set(x,y0+2.6,z-14.0); scene.add(doorGlow);
    const doorSign=new THREE.Mesh(new THREE.BoxGeometry(2.9,.10,.05),new THREE.MeshBasicMaterial({color:0xd5b8ff}));
    doorSign.position.set(x,y0+5.55,z-13.25); scene.add(doorSign);

    const light=new THREE.PointLight(0x3b1cff,2.6,50,2); light.position.set(x,y0+h*0.5,z); scene.add(light);
    // A shimmering ward seals the top platform until every mission has been fulfilled.
    const wardTex=(()=>{ const cvs=document.createElement('canvas'); cvs.width=256; cvs.height=256; const ctx=cvs.getContext('2d');
      const grad=ctx.createRadialGradient(128,128,10,128,128,128); grad.addColorStop(0,'rgba(200,150,255,.55)'); grad.addColorStop(.7,'rgba(120,60,220,.35)'); grad.addColorStop(1,'rgba(80,20,180,0)');
      ctx.fillStyle=grad; ctx.fillRect(0,0,256,256); return new THREE.CanvasTexture(cvs); })();
    const ward=new THREE.Mesh(new THREE.CircleGeometry(10.4,32), new THREE.MeshBasicMaterial({map:wardTex,transparent:true,side:THREE.DoubleSide,depthWrite:false}));
    ward.rotation.x=-Math.PI/2; ward.position.set(x,y0+h+2.0,z);
    scene.add(ward);
    towerWard = ward;
    obstacles.push({kind:'wizardTowerWall', x, z, radius:12.6});
    // Wide spiral staircase begins just above the lowered foundation and reaches the roof.
    const stairCount=170, stairHeight=(h-1.2)/stairCount;
    for(let i=0;i<stairCount;i++){
      const a=TOWER_DOOR_ANGLE + (i/stairCount)*(Math.PI*2*TOWER_STAIR_TURNS);
      const y=y0+1.2 + i*stairHeight;
      const step=new THREE.Mesh(new THREE.BoxGeometry(4.2,.42,2.45),darkStone);
      step.position.set(x+Math.cos(a)*TOWER_STAIR_RADIUS,y,z+Math.sin(a)*TOWER_STAIR_RADIUS);
      step.rotation.y=-a+Math.PI/2;
      step.castShadow=true; step.receiveShadow=true; scene.add(step);
    }
    BOSS_TOWER.topY=y0+h;
  }

      let ok = Math.abs(x)<CITY_EXTENT && Math.abs(z)<CITY_EXTENT;

  // A silent ranged option — same disguise/alert rules apply as any other
  // kill (a guard who sees it happen still reacts), it just lets you reach
  // a target you can't safely close on.
  function throwKnife(){
    if(P.dead || phase!=='play') return;
    if(throwingKnives<=0){ showBanner('NO THROWING KNIVES LEFT — BUY MORE AT THE MARKET'); return; }
    throwingKnives--;
    updateToolsHUD();
    const camPos = new THREE.Vector3(); camera.getWorldPosition(camPos);
    const camFwd = new THREE.Vector3(); camera.getWorldDirection(camFwd).normalize();
    let best=null, bestDist=Infinity;
    const HIT_RADIUS = 1.55;
    villagers.forEach(v=>{
      if(v.dead) return;
      const vp = v.mesh.position.clone(); vp.y += 1.0;
      const toV = vp.clone().sub(camPos);
      const along = toV.dot(camFwd);
      if(along < 0 || along > THROW_KNIFE_RANGE) return;
      const closest = camPos.clone().add(camFwd.clone().multiplyScalar(along));
      const miss = vp.distanceTo(closest);
      if(miss <= HIT_RADIUS && along < bestDist){ best = v; bestDist = along; }
    });
    const dmg = THROW_KNIFE_DMG[0] + Math.random()*(THROW_KNIFE_DMG[1]-THROW_KNIFE_DMG[0]);
    const origin = camPos.clone().add(camFwd.clone().multiplyScalar(0.4)).add(new THREE.Vector3(0,-0.12,0));
    let hitPoint;
    if(best){
      hitPoint = best.mesh.position.clone(); hitPoint.y += 1.0;
      registerHit(best, dmg);
      flashCrosshair(); sfx('hit');
    } else {
      hitPoint = camPos.clone().add(camFwd.clone().multiplyScalar(THROW_KNIFE_RANGE));
    }
    spawnThrownKnifeVisual(origin, hitPoint);
    sfx('swing');
  }

  // One tool, two behaviors depending on what the aim ray connects with:
  //  - Hits an enemy: Scorpion-style harpoon. Stuns them and yanks them in
  //    to melee range ("get over here").
  //  - Hits a building, or nothing at all: Spiderman-style traversal. Fires
  //    a strong pull toward the anchor point and lets momentum carry you
  //    from there, so jumps and swings chain together.
  const GRAPPLE_RANGE = 55;
  const GRAPPLE_COOLDOWN = 1.1;
  const GRAPPLE_PULL_ACCEL = 62;
  const GRAPPLE_MAX_SPEED = 34;
  const GRAPPLE_ENEMY_STUN = 3.2;
  const GRAPPLE_ENEMY_PULL_TIME = 0.45;
  let grappleCooldownTimer = 0;

  let grappleVisual = null;
  let grappleVisualTimer = 0;
  function ensureGrappleVisual(){
    if(grappleVisual) return grappleVisual;
    const mat = new THREE.LineBasicMaterial({color:0x9a8f7c});
    const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
    grappleVisual = new THREE.Line(geo, mat);
    grappleVisual.visible = false;
    grappleVisual.frustumCulled = false;
    scene.add(grappleVisual);
    return grappleVisual;
  }
  function fireGrapple(){
    if(P.dead || phase!=='play' || grappleCooldownTimer>0 || horseMounted) return;
    const camPos = new THREE.Vector3(); camera.getWorldPosition(camPos);
    const camFwd = new THREE.Vector3(); camera.getWorldDirection(camFwd).normalize();

    // 1) Aim-cone check against living targets first — same pattern as the
    // thrown knife, so this feels consistent with the rest of the kit.
    let bestEnemy=null, bestEnemyDist=Infinity;
    const HIT_RADIUS = 1.7;
    villagers.forEach(v=>{
      if(v.dead) return;
      // Village-bound defenders won't be dragged out of their territory —
      // you can only harpoon them if you're already inside it yourself.
      if(v.leashPos && v.leashRadius){
        const playerInZone = Math.hypot(player.position.x-v.leashPos.x, player.position.z-v.leashPos.z) <= v.leashRadius;
        if(!playerInZone) return;
      }
      const vp = v.mesh.position.clone(); vp.y += 1.0;
      const toV = vp.clone().sub(camPos);
      const along = toV.dot(camFwd);
      if(along < 0 || along > GRAPPLE_RANGE) return;
      const closest = camPos.clone().add(camFwd.clone().multiplyScalar(along));
      const miss = vp.distanceTo(closest);
      if(miss <= HIT_RADIUS && along < bestEnemyDist){ bestEnemy = v; bestEnemyDist = along; }
    });

    grappleCooldownTimer = GRAPPLE_COOLDOWN;
    const line = ensureGrappleVisual();

    if(bestEnemy){
      const now = performance.now()/1000;
      bestEnemy.stunnedUntil = now + GRAPPLE_ENEMY_STUN;
      bestEnemy.grapplePulling = true;
      bestEnemy.grappleStart = bestEnemy.mesh.position.clone();
      bestEnemy.grappleElapsed = 0;
      const enemyPoint = bestEnemy.mesh.position.clone(); enemyPoint.y += 1.0;
      line.geometry.setFromPoints([camPos, enemyPoint]);
      line.visible = true;
      grappleVisualTimer = 0.5;
      showBanner('GET OVER HERE!');
      sfx('hit');
      return;
    }

    // 2) No target — check for a wall/building to grab onto (ray vs. the
    // same collision circles used for movement, treated as vertical columns).
    let anchor = null, bestT = GRAPPLE_RANGE;
    for(const o of obstacles){
      if(o.kind==='waterWall' || o.kind==='wizardTowerWall') continue;
      const ox = o.x-camPos.x, oz = o.z-camPos.z;
      const b = ox*camFwd.x + oz*camFwd.z;
      const c = ox*ox + oz*oz - o.radius*o.radius;
      const disc = b*b - c;
      if(disc < 0) continue;
      const t = b - Math.sqrt(disc);
      if(t > 0.5 && t < bestT){
        bestT = t;
        anchor = camPos.clone().add(camFwd.clone().multiplyScalar(t));
        anchor.y = Math.max(4, camPos.y + camFwd.y*t) + 4;
      }
    }
    if(!anchor){
      // Nothing solid in range — still grab a point up ahead so the hook
      // always works for pure aerial traversal, Spiderman-with-no-buildings style.
      anchor = camPos.clone().add(camFwd.clone().multiplyScalar(GRAPPLE_RANGE));
      anchor.y = Math.max(anchor.y, camPos.y) + 6;
    }
    grappleSwing = { anchor, timer:0, duration:0.85 };
    line.visible = true;
    sfx('bow');
  }
  function updateGrapple(dt){
    grappleCooldownTimer = Math.max(0, grappleCooldownTimer-dt);
    if(!grappleSwing){
      if(grappleVisualTimer>0){
        grappleVisualTimer -= dt;
        if(grappleVisualTimer<=0 && grappleVisual) grappleVisual.visible=false;
      }
      return;
    }
    grappleSwing.timer += dt;
    const dir = grappleSwing.anchor.clone().sub(player.position);
    const dist = dir.length();
    if(grappleVisual){
      const camPos = new THREE.Vector3(); camera.getWorldPosition(camPos);
      grappleVisual.geometry.setFromPoints([camPos, grappleSwing.anchor]);
    }
    if(dist < 3 || grappleSwing.timer > grappleSwing.duration){
      grappleSwing = null;
      if(grappleVisual) grappleVisual.visible = false;
      return;
    }
    dir.normalize();
    playerVelX += dir.x*GRAPPLE_PULL_ACCEL*dt;
    playerVelY += dir.y*GRAPPLE_PULL_ACCEL*dt;
    playerVelZ += dir.z*GRAPPLE_PULL_ACCEL*dt;
    const spd = Math.hypot(playerVelX,playerVelY,playerVelZ);
    if(spd > GRAPPLE_MAX_SPEED){ const s=GRAPPLE_MAX_SPEED/spd; playerVelX*=s; playerVelY*=s; playerVelZ*=s; }
  }
  function updateGrappledEnemies(dt){
    villagers.forEach(v=>{
      if(!v.grapplePulling || v.dead) return;
      v.grappleElapsed += dt;
      const t = Math.min(1, v.grappleElapsed/GRAPPLE_ENEMY_PULL_TIME);
      const dir = player.position.clone().sub(v.grappleStart); dir.y = 0;
      const fullDist = dir.length();
      const stopDist = Math.min(fullDist, 1.6);
      const travel = Math.max(0, fullDist-stopDist);
      if(fullDist > 0.001) dir.normalize();
      const pos = v.grappleStart.clone().add(dir.multiplyScalar(travel*t));
      v.mesh.position.x = pos.x; v.mesh.position.z = pos.z;
      v.mesh.lookAt(player.position.x, v.mesh.position.y, player.position.z);
      if(t>=1) v.grapplePulling = false;
    });
  }

  function fireBow(frac){
    const camPos = new THREE.Vector3(); camera.getWorldPosition(camPos);
    const camFwd = new THREE.Vector3(); camera.getWorldDirection(camFwd).normalize();
    if(!currentBow) return;

    // Use a forgiving ray-to-target test instead of a tiny angular cone.
    // This makes the center crosshair authoritative for bow aiming.
    let best=null, bestDist=Infinity;
    const HIT_RADIUS = 1.65;

    function considerTarget(target, aimPos){
      if(!target || target.dead) return;
      const toTarget = aimPos.clone().sub(camPos);
      const along = toTarget.dot(camFwd);
      if(along < 0 || along > currentBow.range) return;
      const closest = camPos.clone().add(camFwd.clone().multiplyScalar(along));
      const miss = aimPos.distanceTo(closest);
      if(miss <= HIT_RADIUS && along < bestDist){
        if(towerBlocksSight(camPos, aimPos)) return;
        best = target;
        bestDist = along;
      }
    }

    if(wizardActive && wizardBoss && !wizardBoss.dead){
      const bp = wizardBoss.mesh.position.clone();
      bp.y += 1.15;
      considerTarget(wizardBoss, bp);
    }

    villagers.forEach(v=>{
      if(v.dead) return;
      const vp = v.mesh.position.clone();
      vp.y += v.isTowerArcher ? 1.2 : 1.0;
      considerTarget(v, vp);
    });

    const dmg = currentBow.dmg[0] + frac*(currentBow.dmg[1]-currentBow.dmg[0]);
    const origin = camPos.clone().add(camFwd.clone().multiplyScalar(0.4)).add(new THREE.Vector3(0,-0.12,0));
    let hitPoint;

    if(best){
      hitPoint = best.mesh.position.clone();
      hitPoint.y += best.isTowerArcher ? 1.2 : 1.0;

      // Damage is applied at the exact moment the shot is released.
      // The arrow/fireball is then only the visual projectile.
      if(best.isWizardBoss) registerWizardHit(dmg);
      else registerHit(best, dmg);
      flashCrosshair();
      sfx('hit');
    } else {
      hitPoint = camPos.clone().add(camFwd.clone().multiplyScalar(currentBow.range));
    }

    if(currentBow.fireball) spawnFlameBall(origin, hitPoint, null, 0);
    else spawnArrowProjectile(origin, hitPoint, 0x6b4a2f, null, 0);
    sfx('bow');
  }
  function doHitCheck(){
    const camPos = new THREE.Vector3(); camera.getWorldPosition(camPos);
    const camFwd = new THREE.Vector3(); camera.getWorldDirection(camFwd);
    const arcCos = Math.cos(THREE.MathUtils.degToRad(currentWeapon.arc));
    let hitAny=false;
    villagers.forEach(v=>{
      if(v.dead) return;
      const vp = v.mesh.position.clone(); vp.y += 1.0;
      const toV = vp.clone().sub(camPos);
      const dist = toV.length();
      if(dist > currentWeapon.range) return;
      toV.normalize();
      if(toV.dot(camFwd) < arcCos) return;
      hitAny = true;
      const dmg = currentWeapon.dmg[0] + Math.random()*(currentWeapon.dmg[1]-currentWeapon.dmg[0]);
      registerHit(v, dmg);
      if(currentWeapon.poisonDot && !v.dead){
        v.poisonDps = currentWeapon.poisonDot.dps;
        v.poisonRemaining = currentWeapon.poisonDot.duration;
        burst(v.mesh.position.clone(), 0x5a8a4f, 6);
      }
    });
    if(hitAny){ sfx('hit'); flashCrosshair(); }
  }

  let endingGroup = null;

  function buildEndingScene(){
    if(fountainGroup) fountainGroup.visible = false;
    if(missionTentGroup) missionTentGroup.visible = false;
    endingGroup = new THREE.Group();
    // A single hooded figure stands alone in the ruined plaza — no
    // coronation, no crowd. Built from the same civilian sprite silhouette
    // used everywhere else in the game.
    const figure = makeVillagerCiv();
    figure.traverse(o=>{ if(o.isMesh && o.material && o.material.color) o.material.color.multiplyScalar(0.55); });
    figure.position.set(0,0,0);

  function updateEndingCamera(dt){
    if(phase !== 'ending' || !endingGroup) return;
    endingElapsed += dt;
    updateDayNight(dt * 0.03);
    const t = Math.min(1, endingElapsed / ENDING_DURATION);
    const ease = t*t*(3-2*t);
    const startY=6, endY=2.6, startZ=16, endZ=6;
    camera.position.y = startY + (endY-startY)*ease;
    camera.position.z = startZ + (endZ-startZ)*ease;
    camera.position.x = Math.sin(endingElapsed*0.05)*1.1;
    camera.lookAt(0, 1.7, 0);
  }

  function makeWizardBoss(){
    const g=new THREE.Group();
    const robe=new THREE.Mesh(new THREE.ConeGeometry(1.15,2.8,8),new THREE.MeshStandardMaterial({color:0x09090b,roughness:.75,emissive:0x120019,emissiveIntensity:.35}));
    robe.position.y=-.5; g.add(robe);
    const head=new THREE.Mesh(new THREE.SphereGeometry(.58,12,10),new THREE.MeshStandardMaterial({color:0x564b63,roughness:.7})); head.position.y=1.35; g.add(head);
    const hood=new THREE.Mesh(new THREE.ConeGeometry(.78,1.0,8),new THREE.MeshStandardMaterial({color:0x030305,roughness:.8})); hood.position.y=1.72; g.add(hood);
    const eyeMat=new THREE.MeshStandardMaterial({color:0x7b2cff,emissive:0x5b00ff,emissiveIntensity:2.5});
    [-.2,.2].forEach(x=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.075,8,6),eyeMat);e.position.set(x,1.42,-.5);g.add(e);});
    for(let i=0;i<3;i++){const orb=new THREE.Mesh(new THREE.SphereGeometry(.12,8,6),eyeMat);orb.position.set(Math.cos(i*2.09)*.95,.2,Math.sin(i*2.09)*.95);g.add(orb);}
    return g;

  // ================= GUARDS / ALERT SYSTEM =================
  // Nobody reports a body that was never seen. Civilians who witness a hit
  // just flee — that's cosmetic, and does not raise the alert on its own.
  // Only a patrol guard actually spotting you undisguised raises it, via
  // guardSpottedPlayer() below.
  const ALERT_HIGH = 3;

  function callGuards(){
    alertLevel++;
    peaceTimer = 0;
    const count = Math.min(1+alertLevel, 10);
    const typePool = ['sentry','spear'];
    if(alertLevel>=2) typePool.push('archer');
    if(alertLevel>=4) typePool.push('berserker');
    const statMult = 1 + (alertLevel-1)*0.1;
    for(let i=0;i<count;i++){
      const type = typePool[Math.floor(Math.random()*typePool.length)];
      const gt = GUARD_TYPES[type];
      const pos = randomStreetPos(player.position.x, player.position.z, 22, 38);
      const mesh = makeGuard(type);
      mesh.position.set(pos.x, 0, pos.z);
      scene.add(mesh);
      villagers.push({
        mesh, isGuard:true, type,
        hp: Math.round(BASE_GUARD_HP*gt.hpMult*statMult), maxHp: Math.round(BASE_GUARD_HP*gt.hpMult*statMult),
        dmgRange:[BASE_GUARD_DMG[0]*gt.dmgMult*statMult, BASE_GUARD_DMG[1]*gt.dmgMult*statMult],
        speed: BASE_GUARD_SPEED*gt.speedMult, range: gt.range, ranged: gt.ranged, stationary:false,
        atkCooldownBase: gt.atkCooldown, attackTimer: Math.random()*0.5,
        state:'attack', hasAlerted:true, dead:false, fallProgress:0
      });
    }
    sfx('alert');
    updateAlertHUD();
  }

  // Fired the moment an undisguised patrol guard is close enough to see you
  // strike. This is the only thing that raises the alert level.
  function guardSpottedPlayer(){
    callGuards();
    showBanner(alertLevel>=ALERT_HIGH ? `A GUARD SAW YOU — WANTED (${alertLevel})` : `A GUARD SAW YOU — ALERT ${alertLevel}`);
  }

  function triggerVillagerFear(v, reason, restartEvenIfAlreadyFleeing=false){
    if(v.isGuard || v.dead) return false;
    const newlyScared = v.state !== 'flee';
    v.state = 'flee';
    v.calmTimer = 0;
    return newlyScared || restartEvenIfAlreadyFleeing;
  }

  function scareNearbyVillagers(point, radius){
    let scared = false;
    villagers.forEach(other=>{
      if(other.isGuard || other.dead) return;
      const d = Math.hypot(other.mesh.position.x-point.x, other.mesh.position.z-point.z);
      if(d <= radius){
        scared = triggerVillagerFear(other, 'witnessed attack', true) || scared;
      }
    });
    return scared;
  }

  // ================= CLEARING YOUR NAME =================
  // Below ALERT_HIGH, notoriety fades on its own once no hostile guard is
  // left standing (see the peaceTimer decay in the main loop). At or above
  // ALERT_HIGH the regime doesn't forget that easily — the only way back to
  // zero is to pay off the right people (500 gold) and then actually
  // disappear into the ruins for a full 12 minutes.
  const CLEAR_NAME_COST = 500;
  const HIDE_DURATION = 12 * 60;
  let hidingActive = false;
  let hidingRemaining = HIDE_DURATION;

  function inRuinedVillage(){
    for(const v of VILLAGES){
      if(Math.hypot(player.position.x-v.x, player.position.z-v.z) < v.halfSize) return v;
    }
    return null;
  }

    if(gold < CLEAR_NAME_COST){ showBanner(`NOT ENOUGH GOLD — LAYING LOW COSTS ${CLEAR_NAME_COST}G`); return; }
    gold -= CLEAR_NAME_COST;

  function clearName(){
    alertLevel = 0;
    hidingActive = false;
    updateAlertHUD();
    // Standing patrol guards go back to their rounds; the extra
    // reinforcements that were called in just melt away.
    for(let i=villagers.length-1;i>=0;i--){
      const v = villagers[i];
      if(v.isGuard && !v.isOutskirtGuard && !v.isWarden && !v.dead){
        if(v.isPatrolGuard){ v.state='patrol'; v.hasAlerted=false; v.wanderTimer=0; }
        else { scene.remove(v.mesh); villagers.splice(i,1); }
      }
    }
    VILLAGES.forEach(v=>{ if(villageTimers[v.id]) villageTimers[v.id].alerted=false; });
    showBanner('YOUR NAME IS CLEAR');
    sfx('coin');
  }

  function updateHiding(dt){
    const prompt = document.getElementById('hidePrompt');
    if(!prompt) return;

      const mins = Math.floor(hidingRemaining/60), secs = Math.floor(hidingRemaining%60).toString().padStart(2,'0');

      prompt.textContent = inside
        ? `Laying low… ${mins}:${secs} remaining`
        : `Get back to the ruins — the clock is paused (${mins}:${secs} left)`;

        ? `[E] Pay ${CLEAR_NAME_COST}g and lay low here for 12 minutes`

    }
  }

  // ================= HORSE =================
  function makeHorse(){
    const g = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({color:0x6b3f24, roughness:.78});
    const darkMat = new THREE.MeshStandardMaterial({color:0x24150e, roughness:.88});
    const muzzleMat = new THREE.MeshStandardMaterial({color:0x4a2b1c, roughness:.9});

    // More natural horse proportions using rounded primitives instead of boxes.
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(.72,1.25,6,12), bodyMat);
    body.rotation.x=Math.PI/2; body.scale.z=1.18; body.position.set(0,1.42,0); body.castShadow=true; g.add(body);

    const chest = new THREE.Mesh(new THREE.SphereGeometry(.76,16,10), bodyMat);
    chest.scale.set(1,.98,.82); chest.position.set(0,1.48,.62); chest.castShadow=true; g.add(chest);

    const neck = new THREE.Mesh(new THREE.CapsuleGeometry(.34,1.15,6,12), bodyMat);
    neck.position.set(0,2.15,.67); neck.rotation.x=-0.27; neck.castShadow=true; g.add(neck);

    const head = new THREE.Mesh(new THREE.CapsuleGeometry(.28,.68,5,10), bodyMat);
    head.position.set(0,2.88,1.08); head.rotation.x=-0.12; head.scale.z=1.12; head.castShadow=true; g.add(head);

    const muzzle = new THREE.Mesh(new THREE.SphereGeometry(.27,12,8), muzzleMat);
    muzzle.scale.set(1,.72,1.18); muzzle.position.set(0,2.73,1.52); muzzle.castShadow=true; g.add(muzzle);

    // Ears
    [-.18,.18].forEach(x=>{
      const ear=new THREE.Mesh(new THREE.ConeGeometry(.13,.38,7),bodyMat);
      ear.position.set(x,3.35,.98); ear.rotation.z=x<0?-.16:.16; ear.castShadow=true; g.add(ear);
    });

    // Eyes
    [-.27,.27].forEach(x=>{
      const eye=new THREE.Mesh(new THREE.SphereGeometry(.055,8,8),darkMat);
      eye.position.set(x,2.98,1.34); g.add(eye);
    });

    // Flowing mane made from several tapered strands.
    for(let i=0;i<7;i++){
      const mane=new THREE.Mesh(new THREE.ConeGeometry(.10,.62,6),darkMat);
      mane.position.set(0,3.12-i*.16,.72-i*.03);
      mane.rotation.z=(i%2?-0.18:0.18); mane.rotation.x=-0.12; mane.castShadow=true; g.add(mane);
    }

    // Four articulated legs with joints and dark hooves.
    [-.48,.48].forEach(x=>[-.78,.78].forEach(z=>{
      const upper=new THREE.Mesh(new THREE.CapsuleGeometry(.115,.62,5,8),bodyMat);
      upper.position.set(x,.95,z); upper.castShadow=true; g.add(upper);
      const lower=new THREE.Mesh(new THREE.CapsuleGeometry(.09,.48,5,8),bodyMat);
      lower.position.set(x,.48,z); lower.castShadow=true; g.add(lower);
      const hoof=new THREE.Mesh(new THREE.SphereGeometry(.15,8,6),darkMat);
      hoof.scale.set(1,.55,1.35); hoof.position.set(x,.13,z+.06); hoof.castShadow=true; g.add(hoof);
    }));

    // Fuller tail with several strands.
    for(let i=0;i<5;i++){
      const tail=new THREE.Mesh(new THREE.ConeGeometry(.10,.82,6),darkMat);
      tail.position.set((i-2)*.07,1.68,-1.32); tail.rotation.x=Math.PI/2 + (i-2)*.06; tail.castShadow=true; g.add(tail);
    }

    const saddle = new THREE.Mesh(new THREE.CapsuleGeometry(.55,.55,4,10),new THREE.MeshStandardMaterial({color:0x3b2416,roughness:.82}));
    saddle.scale.set(1.35,.22,1.05); saddle.position.set(0,1.93,.02); saddle.castShadow=true; g.add(saddle);
    const bridle = new THREE.Mesh(new THREE.TorusGeometry(.30,.035,6,16),new THREE.MeshStandardMaterial({color:0x16120f,metalness:.25,roughness:.65}));
    bridle.rotation.x=Math.PI/2; bridle.position.set(0,2.92,1.38); g.add(bridle);
    return g;
  }
  function spawnHorse(){

  function mountHorse(){

  // ================= MOVEMENT =================
  const MOVE_SPEED=6, SPRINT_SPEED=10, HORSE_SPEED=18, HORSE_SPRINT_SPEED=24, PLAYER_RADIUS=0.55;
  const GRAVITY = -34;
  const JUMP_SPEED = 11.5;
  const GROUND_ACCEL = 46, AIR_ACCEL = 16, GROUND_FRICTION = 10;
  let playerVelY = 0;
  let playerVelX = 0, playerVelZ = 0;
  let grounded = true;
  function groundSupportAt(x,z){
    // The ground is flat at y=0 everywhere — except on top of a flat rooftop,
    // where the deck itself counts as ground while you're standing over it.
    for(let i=0;i<flatRoofs.length;i++){
      const r = flatRoofs[i];
      if(x > r.x-r.halfW && x < r.x+r.halfW && z > r.z-r.halfD && z < r.z+r.halfD) return r.y;
    }
    return 0;
  }
  function towerBlocksSight(start, end){
    if(!towerWallMesh || !towerWallMesh.visible) return false;
    const dir=end.clone().sub(start);
    const dist=dir.length();
    if(dist<=0.001) return false;
    dir.normalize();
    const ray=new THREE.Raycaster(start,dir,0,dist);
    const hits=ray.intersectObject(towerWallMesh,false);
    return hits.length>0 && hits[0].distance < dist-0.05;
  }
  function pushOutOfObstacles(pos, radius){
    for(let i=0;i<obstacles.length;i++){
      const o = obstacles[i];
      if(o.kind==='waterWall'){
        if(Math.abs(pos.z) <= o.halfLength && pos.x > o.x-radius){
          pos.x = o.x-radius;
        }
        continue;
      }
      if(o.kind==='wizardTowerWall'){
        const dx=pos.x-o.x, dz=pos.z-o.z, d=Math.sqrt(dx*dx+dz*dz);
        // The doorway is a slice on the south (-Z) face only — don't open a phantom gap on the far side.
        const nearDoor = dz < -(o.radius-0.9) && Math.abs(dx) < 2.9;
        if(d > o.radius-radius && d < o.radius+radius && !nearDoor){
          const nd=Math.max(0.001,d);
          const target = d < o.radius ? (o.radius-radius) : (o.radius+radius);
          pos.x += (dx/nd)*(target-d); pos.z += (dz/nd)*(target-d);
        }
        continue;
      }
      // A building with a flat rooftop stops blocking horizontal movement
      // once the player is up on the deck — otherwise the same collision
      // circle that keeps you out of the walls would also pin you at the
      // roof's edge and make the rooftop useless to walk around on.
      if(o.roofY != null && pos.y >= o.roofY - 0.6) continue;
      const dx=pos.x-o.x, dz=pos.z-o.z, d=Math.sqrt(dx*dx+dz*dz), minD=o.radius+radius;
      if(d<minD && d>0.0001){ pos.x += (dx/d)*(minD-d); pos.z += (dz/d)*(minD-d); }
    }
  }
  function updateMovement(dt){
    player.rotation.y = yaw;
    camera.rotation.x = pitch;
    const forward = new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(0,yaw,0));
    const right = new THREE.Vector3(1,0,0).applyEuler(new THREE.Euler(0,yaw,0));
    let moveDir = new THREE.Vector3();
    if(keys['KeyW']) moveDir.add(forward);
    if(keys['KeyS']) moveDir.sub(forward);
    if(keys['KeyD']) moveDir.add(right);
    if(keys['KeyA']) moveDir.sub(right);
    const moving = moveDir.lengthSq() > 0.0001;
    if(moving) moveDir.normalize();
    const sprinting = keys['ShiftLeft'] && moving && P.stamina>0;
    const speed = horseMounted ? (sprinting ? HORSE_SPRINT_SPEED : HORSE_SPEED) : (sprinting ? SPRINT_SPEED : MOVE_SPEED);
    if(sprinting) P.stamina = Math.max(0, P.stamina - 28*dt);
    else P.stamina = Math.min(P.maxStamina, P.stamina + 18*dt);

    if(horseMounted){
      // Horses stay on the ground, no jump/momentum — simple and predictable.
      const newPos = player.position.clone().add(moveDir.multiplyScalar(speed*dt));
      newPos.x = Math.max(-WORLD_BOUND, Math.min(WORLD_BOUND, newPos.x));
      newPos.z = Math.max(-WORLD_BOUND, Math.min(WORLD_BOUND, newPos.z));
      pushOutOfObstacles(newPos, PLAYER_RADIUS);
      player.position.x = newPos.x; player.position.z = newPos.z; player.position.y = 0;
      playerVelX = 0; playerVelZ = 0; playerVelY = 0; grounded = true;
      updateHorse(dt);
    } else {
      const support = groundSupportAt(player.position.x, player.position.z);
      grounded = player.position.y <= support + 0.05 && playerVelY <= 0.01;

      // Jump — only from the ground, and never mid-grapple.
      if(keys['Space'] && grounded && !grappleSwing){
        playerVelY = JUMP_SPEED;
        grounded = false;
        sfx('swing');
      }

      // Momentum-based horizontal movement: velocity eases toward the
      // desired speed instead of snapping to it. Ground acceleration is
      // brisk and responsive; air control is looser, so jumps and grapple
      // pulls carry real momentum instead of being overridden by WASD.
      const desiredX = moveDir.x*speed, desiredZ = moveDir.z*speed;
      if(moving){
        const accel = grounded ? GROUND_ACCEL : AIR_ACCEL;
        playerVelX += (desiredX-playerVelX) * Math.min(1, accel*dt);
        playerVelZ += (desiredZ-playerVelZ) * Math.min(1, accel*dt);
      } else if(grounded){
        const damp = Math.max(0, 1-GROUND_FRICTION*dt);
        playerVelX *= damp; playerVelZ *= damp;
      }
      // Airborne with no input: velocity is left alone and simply carries —
      // this is what makes jumps and grapple swings feel like momentum
      // rather than the ground fighting you the instant you let go of a key.

      if(!grounded) playerVelY += GRAVITY*dt;

      updateGrapple(dt);

      const newPos = player.position.clone();
      newPos.x += playerVelX*dt;
      newPos.z += playerVelZ*dt;
      newPos.y += playerVelY*dt;
      newPos.x = Math.max(-WORLD_BOUND, Math.min(WORLD_BOUND, newPos.x));
      newPos.z = Math.max(-WORLD_BOUND, Math.min(WORLD_BOUND, newPos.z));
      pushOutOfObstacles(newPos, PLAYER_RADIUS);
      const groundHere = groundSupportAt(newPos.x, newPos.z);
      if(newPos.y <= groundHere){ newPos.y = groundHere; playerVelY = 0; }
      player.position.copy(newPos);
    }

    const now = performance.now()/1000;
    if(now - P.lastHitTime > 4 && P.health < P.maxHealth) P.health = Math.min(P.maxHealth, P.health + 3*dt);
    nearShop = Math.hypot(player.position.x-SHOP_POS.x, player.position.z-SHOP_POS.z) < 4.5;
    document.getElementById('interactPrompt').style.display = nearShop ? 'block' : 'none';
    nearTent = Math.hypot(player.position.x-TENT_POS.x, player.position.z-TENT_POS.z) < 4.5;
    document.getElementById('tentPrompt').style.display = nearTent ? 'block' : 'none';
  }
  const _moveDir = new THREE.Vector3();
  const _movePos = new THREE.Vector3();
  function moveTowards(mesh, target, speed, dt, avoidRadius){
    const dir = _moveDir.set(target.x-mesh.position.x, 0, target.z-mesh.position.z);
    const d = dir.length();
    if(d < 0.05) return;
    dir.normalize();
    const p = _movePos.set(mesh.position.x + dir.x*speed*dt, 0, mesh.position.z + dir.z*speed*dt);
    pushOutOfObstacles(p, avoidRadius||0.5);
    mesh.position.x = p.x; mesh.position.z = p.z;
    mesh.lookAt(mesh.position.x+dir.x, mesh.position.y, mesh.position.z+dir.z);
  }

  // ================= VILLAGER / GUARD AI =================
  const ALERT_RADIUS=9, FLEE_SAFE_DIST=22, GUARD_SIGHT_RADIUS=16;
  // Get high enough above an enemy — a rooftop, a grapple swing — and they
  // simply lose you: no detection, no fear, no attacks, nothing. This is
  // what makes climbing and swinging actually useful for evasion.
  const VERTICAL_SIGHT_LIMIT = 6.5;
  const _fleeAway = new THREE.Vector3();
  const _fleeTarget = new THREE.Vector3();
  const FAR_AI_SKIP_SQ = 195*195;
  function updateVillagers(dt){
    const pPos = player.position;
    const disguised = isDisguised();
    const now = performance.now()/1000;
    villagers.forEach(v=>{
      if(v.dead){
        if(v.fallProgress<1){
          v.fallProgress = Math.min(1, v.fallProgress + dt*2.2);
          v.mesh.rotation.z = THREE.MathUtils.lerp(0, Math.PI/2, v.fallProgress);
        }
        return;
      }
      if(v.stunnedUntil && now < v.stunnedUntil) return;
      if(pPos.y - v.mesh.position.y > VERTICAL_SIGHT_LIMIT) return;
      if(v.state!=='attack'){
        const fdx=pPos.x-v.mesh.position.x, fdz=pPos.z-v.mesh.position.z;
        if(fdx*fdx+fdz*fdz > FAR_AI_SKIP_SQ) return;
      }
      if(v.alwaysHostile){
        // Contract targets (looters, the Iron Warden) attack on sight —
        // your disguise only fools the regime, not the men you're hunting.
        resolveAttack(v, dt, pPos);
        return;
      }
      if(v.isGuard){
        if(v.isWarden){
          // A named warden always attacks, even through a disguise.
          resolveAttack(v, dt, pPos);
          return;
        }
        if(v.isOutskirtGuard){
          const villageState=villageTimers[v.villageId];
          const distToPlayer=Math.hypot(pPos.x-v.mesh.position.x,pPos.z-v.mesh.position.z);
          if(!villageState || !villageState.alerted){
            if(v.isTowerArcher && disguised){ v.state='guard'; return; }
            if(!disguised && distToPlayer < (v.isTowerArcher ? (v.range||48) : 18)){
              v.state='attack';
              if(!v.hasAlerted){ v.hasAlerted=true; guardSpottedPlayer(); }
            }
            else { v.state='guard'; return; }
          }
          resolveAttack(v, dt, pPos);
          return;
        }
        // City patrol guards: they walk the streets like anyone else and
        // pay you no mind at all while you're disguised — a knife pulled
        // out of sight of a guard never gets reported. Only if a guard is
        // actually close enough to see it happen does anything change.
        if(v.state==='attack'){ resolveAttack(v, dt, pPos); return; }
        const distToPlayer = Math.hypot(pPos.x-v.mesh.position.x, pPos.z-v.mesh.position.z);
        if(!disguised && distToPlayer < GUARD_SIGHT_RADIUS){
          v.state='attack';
          if(!v.hasAlerted){ v.hasAlerted=true; guardSpottedPlayer(); }
          resolveAttack(v, dt, pPos);
          return;
        }
        v.wanderTimer -= dt;
        if(v.wanderTimer<=0){
          v.wanderTimer = 3+Math.random()*4;
          const ang=Math.random()*Math.PI*2, rad=6+Math.random()*16;
          v.target.set(v.home.x+Math.cos(ang)*rad, 0, v.home.z+Math.sin(ang)*rad);
        }
        moveTowards(v.mesh, v.target, v.speed*0.5, dt, 0.6);
        return;
      }
      const dx = pPos.x-v.mesh.position.x, dz = pPos.z-v.mesh.position.z;
      const distToPlayer = Math.sqrt(dx*dx+dz*dz);
      if(v.isVillageVillager){
        const village=VILLAGES.find(x=>x.id===v.villageId);
        if(!village) return;
        if(v.state==='wander'){
          if(distToPlayer < ALERT_RADIUS && !disguised){ triggerVillagerFear(v, 'saw player'); }
          else {
            v.wanderTimer -= dt;
            if(v.wanderTimer<=0){
              v.wanderTimer=2+Math.random()*3;
              const ang=Math.random()*Math.PI*2, rad=Math.random()*9;
              v.target.set(village.x+Math.cos(ang)*rad,0,village.z+Math.sin(ang)*rad);
            }
            moveTowards(v.mesh,v.target,2.0,dt,0.5);
          }
        } else if(v.state==='flee'){
          const away=_fleeAway.set(v.mesh.position.x-pPos.x,0,v.mesh.position.z-pPos.z); if(away.lengthSq()<0.001) away.set(1,0,0); away.normalize();
          const fleeTarget=_fleeTarget.copy(v.mesh.position).add(away.multiplyScalar(7)); moveTowards(v.mesh,fleeTarget,7.2,dt,0.5);
          if(distToPlayer>FLEE_SAFE_DIST){ v.calmTimer+=dt; if(v.calmTimer>2){v.state='wander';v.calmTimer=0;} } else v.calmTimer=0;
        }
        return;
      }
      if(v.state==='wander'){
        // Disguise hides the player; without a disguise, being seen scares villagers.
        if(distToPlayer < ALERT_RADIUS && !disguised){ triggerVillagerFear(v, 'saw player'); }
        else {
          v.wanderTimer -= dt;
          if(v.wanderTimer<=0){
            v.wanderTimer = 2+Math.random()*3;
            // Villagers mostly roam their own neighborhood; only occasionally
            // drift toward the central town square/market, for a slight but
            // not overwhelming pull toward the center.
            const usePlaza = Math.random() < (v.plazaBias || 0.15);
            const centerX = usePlaza ? MARKET_POS.x : v.home.x;
            const centerZ = usePlaza ? MARKET_POS.z : v.home.z;
            const ang = Math.random()*Math.PI*2, rad = usePlaza ? 8+Math.random()*12 : 4+Math.random()*10;
            v.target.set(centerX+Math.cos(ang)*rad, 0, centerZ+Math.sin(ang)*rad);
          }
          moveTowards(v.mesh, v.target, 2.0, dt, 0.5);
        }
      } else if(v.state==='flee'){
        const away = _fleeAway.set(v.mesh.position.x-pPos.x, 0, v.mesh.position.z-pPos.z);
        if(away.lengthSq()<0.001) away.set(Math.random()-.5,0,Math.random()-.5);
        away.normalize();
        const fleeTarget = _fleeTarget.copy(v.mesh.position).add(away.multiplyScalar(6));
        moveTowards(v.mesh, fleeTarget, 7.2, dt, 0.5);
        if(distToPlayer > FLEE_SAFE_DIST){
          v.calmTimer += dt;
          if(v.calmTimer > 2){ v.state='wander'; v.calmTimer=0; v.target.copy(v.mesh.position); }
        } else v.calmTimer = 0;
      }
    });
  }

  function resolveAttack(v, dt, targetPos){
    // Village-bound defenders (guards, the Warden, purge hostiles, and any
    // elite tied to a specific ruin) won't leave their turf chasing you.
    // If you're out of leash range, they give up and head back home instead.
    if(v.leashPos && v.leashRadius){
      const targetDistFromHome = Math.hypot(targetPos.x-v.leashPos.x, targetPos.z-v.leashPos.z);
      if(targetDistFromHome > v.leashRadius){
        const distFromHome = Math.hypot(v.mesh.position.x-v.leashPos.x, v.mesh.position.z-v.leashPos.z);
        if(distFromHome > 2.5) moveTowards(v.mesh, v.leashPos, v.speed, dt, 0.6);
        return;
      }
    }
    const tdx = targetPos.x-v.mesh.position.x, tdz = targetPos.z-v.mesh.position.z;
    const td = Math.sqrt(tdx*tdx+tdz*tdz);
    if(td > v.range){
      if(v.stationary) return;
      moveTowards(v.mesh, targetPos, v.speed, dt, 0.6);
      return;
    }
    v.mesh.lookAt(targetPos.x, v.mesh.position.y, targetPos.z);
    v.attackTimer -= dt;
    if(v.attackTimer<=0){
      v.attackTimer = v.atkCooldownBase;
      const dmg = v.dmgRange[0] + Math.random()*(v.dmgRange[1]-v.dmgRange[0]);
      if(v.ranged){ const tp=targetPos.clone(); tp.y+=1.4; const sh=v.mesh.position.clone(); sh.y+=1.1; spawnArrowProjectile(sh, tp, 0x883333); }
      hurtPlayer(dmg, v.ranged);
    }
  }

  // ================= REGIME PATROLS =================
  // Guards who actually walk the streets, in the open, all game long — not
  // a reactive spawn. They only turn hostile if they catch you undisguised.
  const TARGET_PATROL_GUARDS = 8;
  function spawnCityPatrolGuard(){
    const pos = randomStreetPos();
    const type = Math.random()<0.7 ? 'sentry' : (Math.random()<0.6 ? 'spear' : 'archer');
    const gt = GUARD_TYPES[type];
    const mesh = makeGuard(type);
    mesh.position.set(pos.x,0,pos.z);
    mesh.rotation.y = Math.random()*Math.PI*2;
    scene.add(mesh);
