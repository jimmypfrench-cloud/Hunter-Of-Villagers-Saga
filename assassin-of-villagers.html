  // ================= GOLD / PARTICLES / PROJECTILES =================
  function updateGold(dt){
    for(let i=goldPickups.length-1;i>=0;i--){
      const g = goldPickups[i];
      g.mesh.rotation.z += dt*3;
      const dx = player.position.x-g.mesh.position.x, dz = player.position.z-g.mesh.position.z;
      if(Math.sqrt(dx*dx+dz*dz) < 1.6){
        gold += g.amount; sfx('coin');
        document.getElementById('goldCount').textContent = gold;
        scene.remove(g.mesh); goldPickups.splice(i,1);
      }
    }
  }
  function updateParticles(dt){
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.vel.y -= 9*dt;
      p.mesh.position.add(p.vel.clone().multiplyScalar(dt));
      p.life -= dt*1.3;
      p.mesh.material.opacity = Math.max(0,p.life/p.maxLife);
      if(p.life<=0){ scene.remove(p.mesh); p.mesh.material.dispose(); particles.splice(i,1); }
    }
  }
  function updateProjectiles(dt){
    for(let i=projectiles.length-1;i>=0;i--){
      const pr=projectiles[i];
      if(pr.kind==='bossBolt' || pr.kind==='flame'){
        pr.pos.addScaledVector(pr.vel,dt); pr.mesh.position.copy(pr.pos); pr.life-=dt;
        if(pr.kind==='bossBolt'){
          const prev=pr.pos.clone().sub(pr.vel.clone().multiplyScalar(dt));
          if(towerBlocksSight(prev,pr.pos)){ pr.life=0; }
          if(!P.dead && pr.life>0 && pr.pos.distanceTo(player.position.clone().add(new THREE.Vector3(0,1,0))) < pr.radius){
            hurtPlayer(pr.damage,true); pr.life=0;
          }
        }
        if(pr.kind==='flame' && !pr.hitApplied && pr.target && !pr.target.dead){
          const targetPoint = pr.target.isWizardBoss
            ? pr.target.mesh.position.clone()
            : pr.target.mesh.position.clone().add(new THREE.Vector3(0,1,0));
          if(pr.pos.distanceTo(targetPoint) <= pr.radius){
            if(pr.target.isWizardBoss) registerWizardHit(pr.damage);
            else registerHit(pr.target, pr.damage);
            flashCrosshair(); sfx('hit');
            pr.hitApplied=true;
            pr.life=0;
          }
        }
        if(pr.life<=0){ scene.remove(pr.mesh); projectiles.splice(i,1); }
      } else if(pr.kind==='arrow'){
        pr.elapsed += dt;
        const t=Math.min(1,pr.elapsed/pr.duration);
        pr.mesh.position.lerpVectors(pr.start,pr.end,t);
        if(t>=1){
          if(!pr.hitApplied && pr.target && !pr.target.dead){
            if(pr.target.isWizardBoss) registerWizardHit(pr.damage);
            else registerHit(pr.target, pr.damage);
            flashCrosshair();
            sfx('hit');
            pr.hitApplied=true;
          }
          scene.remove(pr.mesh);
          projectiles.splice(i,1);
        }
      } else {
        pr.elapsed += dt;
        const t=Math.min(1,pr.elapsed/pr.duration);
        pr.mesh.position.lerpVectors(pr.start,pr.end,t);
        if(pr.kind==='thrownKnife') pr.mesh.rotation.x += dt*22;
        if(t>=1){ scene.remove(pr.mesh); projectiles.splice(i,1); }
      }
    }
  }
  function updateSwing(dt){
    swingCooldown = Math.max(0, swingCooldown-dt);
    if(swinging){
      swingTimer += dt;
      const t = Math.min(1, swingTimer/(0.32*(currentWeapon.cooldown/0.55)));
      sword.rotation.x = SWORD_REST.x - Math.sin(t*Math.PI)*1.9;
      sword.rotation.z = SWORD_REST.z - Math.sin(t*Math.PI)*0.7;
      if(t>=0.45 && !hitRegistered){ hitRegistered=true; doHitCheck(); }
      if(t>=1){ swinging=false; sword.rotation.x=SWORD_REST.x; sword.rotation.z=SWORD_REST.z; }
    }
  }
  function updateBowDraw(dt){
    bowCooldown = Math.max(0, bowCooldown-dt);
    const fovBlend = 1 - Math.exp(-dt*16);
    if(Math.abs(camera.fov-targetCameraFov) > 0.01){
      camera.fov += (targetCameraFov-camera.fov)*fovBlend;
      camera.updateProjectionMatrix();
    } else if(camera.fov !== targetCameraFov){
      camera.fov = targetCameraFov;
      camera.updateProjectionMatrix();
    }
    if(isDrawing && equippedBowId){
      drawTime = Math.min(currentBow.drawTime, drawTime+dt);
      const frac = drawTime/currentBow.drawTime;
      stringGroup.position.z = frac*0.22;

  // ================= MINIMAP =================
  // Purchased once at the market. Throttled to a few redraws a second —
  // it's a simple top-down sketch, not something worth paying for every frame.
  const minimapCanvas = document.getElementById('minimap');
  const minimapCtx = minimapCanvas ? minimapCanvas.getContext('2d') : null;
  let minimapTimer = 0;
  const MINIMAP_RANGE = 260;
  function drawMinimap(){
    if(!minimapCtx) return;
    const W = minimapCanvas.width, H = minimapCanvas.height, cx = W/2, cy = H/2;
    const scale = (W*0.46) / MINIMAP_RANGE;
    minimapCtx.clearRect(0,0,W,H);
    minimapCtx.fillStyle = 'rgba(20,16,12,.55)';
    minimapCtx.fillRect(0,0,W,H);
    function project(x,z){ return [cx + (x-player.position.x)*scale, cy + (z-player.position.z)*scale]; }
    // City footprint.
    minimapCtx.strokeStyle = 'rgba(214,178,138,.5)';
    minimapCtx.lineWidth = 1;
    const [cx0,cz0] = project(-CITY_EXTENT,-CITY_EXTENT);
    minimapCtx.strokeRect(cx0, cz0, CITY_EXTENT*2*scale, CITY_EXTENT*2*scale);
    // Villages.
    VILLAGES.forEach(v=>{
      const [x,z] = project(v.x, v.z);
      if(x<-10||x>W+10||z<-10||z>H+10) return;
      minimapCtx.fillStyle = v.fortified ? '#c73e3e' : (v.peaceful ? '#5a8a4f' : '#c78a3e');
      minimapCtx.beginPath(); minimapCtx.arc(x,z,3.4,0,Math.PI*2); minimapCtx.fill();
    });
    // Shop and contract tent.
    [[SHOP_POS,'#e0c25a'],[TENT_POS,'#6ea0e0']].forEach(([pos,color])=>{
      const [x,z] = project(pos.x,pos.z);
      minimapCtx.fillStyle = color;
      minimapCtx.beginPath(); minimapCtx.arc(x,z,2.6,0,Math.PI*2); minimapCtx.fill();
    });
    // Active elite/bounty targets.
    villagers.forEach(v=>{
      if(!v.isBountyTarget || v.dead) return;
      const [x,z] = project(v.mesh.position.x, v.mesh.position.z);
      if(x<-10||x>W+10||z<-10||z>H+10) return;
      minimapCtx.fillStyle = '#e64545';
      minimapCtx.beginPath(); minimapCtx.moveTo(x,z-4); minimapCtx.lineTo(x+3.4,z+3); minimapCtx.lineTo(x-3.4,z+3); minimapCtx.closePath(); minimapCtx.fill();
    });
    // Player marker + heading.
    minimapCtx.save();
    minimapCtx.translate(cx,cy);
    minimapCtx.rotate(yaw);
    minimapCtx.fillStyle = '#efe0c2';
    minimapCtx.beginPath();
    minimapCtx.moveTo(0,-6); minimapCtx.lineTo(4,5); minimapCtx.lineTo(0,2.5); minimapCtx.lineTo(-4,5);
    minimapCtx.closePath(); minimapCtx.fill();
    minimapCtx.restore();
  }
  function updateMinimap(dt){
    if(!minimapCanvas) return;
    if(!ownedMap){ minimapCanvas.style.display='none'; return; }
    minimapCanvas.style.display='block';
    minimapTimer -= dt;
    if(minimapTimer > 0) return;
    minimapTimer = 0.2;
    drawMinimap();
  }

  // ================= PASSWORD SYSTEM =================
  // A password is a snapshot of everything the player has earned: gold, kills,
  // owned/equipped gear, and the horse. It's handed out on death so a player who
  // has to log out can punch it back in at the start screen and pick up right
  // where their next respawn would have put them (health/stamina full, at the boat).
  function buildPassword(){
    const state = {
      g: gold,
      k: P.kills,
      ow: Array.from(ownedWeapons),
      ew: equippedWeaponId,
      a: alertLevel,
      sb: smokeBombs,
      tk: throwingKnives,
      mp: ownedMap,
      m: MISSIONS.map(m => m.type==='purge' ? [m.status, m.progress] : m.status)
    };
    const json = JSON.stringify(state);
    let b64;
    try{ b64 = btoa(unescape(encodeURIComponent(json))); }catch(e){ return ''; }
    let sum = 0;
    for(let i=0;i<b64.length;i++) sum = (sum + b64.charCodeAt(i)*(i+1)) % 9973;
    const checksum = sum.toString(36).toUpperCase().padStart(3,'0');
    return checksum + '-' + b64;
  }
  function parsePassword(pw){
    // Built-in completion password: every contract is already turned in and
    // every knife/tool is unlocked.
    if(pw && ['ALLCONTRACTS','ALLMISSIONS'].includes(pw.trim().toUpperCase())){
      return {g:10000,k:0,ow:['rusty','iron','poison','shadow'],ew:'shadow',a:0,sb:5,tk:10,mp:true,
        m:['done','done','done',['done',8],['done',15],'done','done','done']};
    }
    if(!pw) return null;
    pw = pw.trim();
    const dash = pw.indexOf('-');
    if(dash<0) return null;
    const checksum = pw.slice(0,dash);
    const b64 = pw.slice(dash+1);
    let sum = 0;
    for(let i=0;i<b64.length;i++) sum = (sum + b64.charCodeAt(i)*(i+1)) % 9973;
    const expected = sum.toString(36).toUpperCase().padStart(3,'0');
    if(checksum !== expected) return null;
    try{
      const json = decodeURIComponent(escape(atob(b64)));
      const state = JSON.parse(json);
      if(typeof state !== 'object' || state===null) return null;
      return state;
    }catch(e){ return null; }
  }
  function applyPassword(state){
    gold = Number(state.g)||0;
    P.kills = Number(state.k)||0;
    alertLevel = Math.max(0, Number(state.a)||0);
    smokeBombs = Math.max(0, Number(state.sb)||0);
    throwingKnives = Math.max(0, Number(state.tk)||0);
    ownedMap = !!state.mp;
    ownedWeapons.clear(); ownedWeapons.add('rusty');
    (Array.isArray(state.ow)?state.ow:[]).forEach(id=>{ if(WEAPONS.some(w=>w.id===id)) ownedWeapons.add(id); });
    if(state.ew && ownedWeapons.has(state.ew)) equipWeapon(state.ew); else equipWeapon('rusty');
    const validStatus = new Set(['available','active','ready','done']);
    if(Array.isArray(state.m)){
      state.m.forEach((entry, idx)=>{
        const m = MISSIONS[idx];
        if(!m) return;
        if(m.type==='purge'){
          if(Array.isArray(entry)){
            const [status, progress] = entry;
            if(validStatus.has(status)) m.status = status;
            m.progress = Math.max(0, Math.min(m.required, Number(progress)||0));
          }
        } else if(validStatus.has(entry)) m.status = entry;
      });
    }
    updateMissionHUD();
    updateAlertHUD();
    updateToolsHUD();
    const gc = document.getElementById('goldCount'); if(gc) gc.textContent = gold;
  }

  // ================= DEATH / RESPAWN =================
  let lastPassword = '';
  function onPlayerDeath(){
    P.dead = true;
    for(let i=projectiles.length-1;i>=0;i--){ scene.remove(projectiles[i].mesh); projectiles.splice(i,1); }
    phase = 'dead';
    intentionalUnlock = true;
    document.exitPointerLock();
    // Reinforcement/hunting guards disperse; standing patrols remain (they'll
    // simply go back to walking their rounds once alert clears).
    for(let i=villagers.length-1;i>=0;i--){
      const v=villagers[i];
      if(v.isGuard && !v.isOutskirtGuard && !v.isPatrolGuard){ scene.remove(v.mesh); villagers.splice(i,1); }
      else if(v.isPatrolGuard){ v.state='patrol'; v.hasAlerted=false; }
    }
    if(kingBoss && !kingBoss.dead){
      scene.remove(kingBoss.mesh);
      const idx = villagers.indexOf(kingBoss);
      if(idx>=0) villagers.splice(idx,1);
      kingBoss = null;
      kingSpawned = false;
      kingReinforcementsSummoned = false;
    }
    alertLevel = 0; peaceTimer = 0; hidingActive = false; updateAlertHUD();
    const bossWrap = document.getElementById('bossHealthWrap'); if(bossWrap) bossWrap.style.display = 'none';
    VILLAGES.forEach(v=>{ villageTimers[v.id].alerted=false; });
    cancelActiveMissions();
    lastPassword = buildPassword();
    renderDead();
  }

      else if(owned) btn = `<button class="owned" data-action="equip-weapon" data-id="${w.id}">Equip</button>`;
      else btn = `<button data-action="buy-weapon" data-id="${w.id}" ${gold<w.cost?'disabled':''}>Buy — ${w.cost}g</button>`;
      const statLine = `<div class="stat">Strike speed: ${(1/w.cooldown).toFixed(2)}/s</div><div class="stat">Reach: ${w.range.toFixed(1)}m</div>`;
      const poisonLine = w.poisonDot ? `<div class="stat" style="color:#8fc77a">Poison: +${w.poisonDot.dps}/s for ${w.poisonDot.duration}s (${w.poisonDot.dps*w.poisonDot.duration} total)</div>` : '';
      return `<div class="wcard ${equipped?'equipped':''}"><h4>${w.name}</h4><div class="stat">Damage: ${w.dmg[0]}–${w.dmg[1]}</div>${statLine}${poisonLine}${btn}</div>`;
    }
    const knifeCards = WEAPONS.map(weaponCard).join('');
    const smokeCard = `<div class="wcard"><h4>Smoke Bomb</h4><div class="stat">Vanish instantly and re-hide from anyone chasing you</div><div class="stat">Held: ${smokeBombs}</div><button data-action="buy-smoke" ${gold<SMOKE_BOMB_COST?'disabled':''}>Buy ${SMOKE_BOMB_PACK} — ${SMOKE_BOMB_COST}g</button></div>`;
    const knifeThrowCard = `<div class="wcard"><h4>Throwing Knife</h4><div class="stat">Damage: ${THROW_KNIFE_DMG[0]}–${THROW_KNIFE_DMG[1]} · Range: ${THROW_KNIFE_RANGE}m</div><div class="stat">Held: ${throwingKnives}</div><button data-action="buy-throwknife" ${gold<THROW_KNIFE_COST?'disabled':''}>Buy ${THROW_KNIFE_PACK} — ${THROW_KNIFE_COST}g</button></div>`;
    const mapCard = `<div class="wcard ${ownedMap?'equipped':''}"><h4>Ruined City Map</h4><div class="stat">Shows a live minimap at the top of your screen — villages, market, contract tent, marked targets</div>${ownedMap?'<button class="owned" disabled>Owned</button>':`<button data-action="buy-map" ${gold<MAP_COST?'disabled':''}>Buy — ${MAP_COST}g</button>`}</div>`;
    overlay.innerHTML = `
      <h1 style="font-size:32px">BLACK MARKET</h1>
      <div class="statusrow"><span>⛁ <b>${gold}</b> gold</span><span>Alert level: <b>${alertLevel}</b></span></div>
      <div class="sectionLabel">Knives — a sharper blade, a faster kill</div>
      <div class="shopgrid">${knifeCards}</div>
      <div class="sectionLabel">Assassin Tools</div>
      <div class="shopgrid">${smokeCard}${knifeThrowCard}${mapCard}</div>
      <button class="bigbtn" data-action="close-shop">Back To The Streets</button>
    `;
    overlay.style.display='flex';
  }

  function renderMissions(){
    const atLimit = activeMissionCount() >= MAX_ACTIVE_MISSIONS;
    function missionCard(m){
      let btn, statusLine;
      if(m.status==='available'){
        statusLine = m.type==='purge' ? `Kill ${m.required} hostiles in this ruin` : `Track and kill the marked target`;
        btn = atLimit
          ? `<button class="owned" disabled>Contracts Full</button>`
          : `<button data-action="accept-mission" data-id="${m.id}">Accept — pays ${m.reward}g</button>`;
      } else if(m.status==='active'){
        statusLine = m.type==='purge' ? `Progress: ${m.progress}/${m.required}` : `Target marked in the city — find and kill him`;
        btn = `<button class="owned" disabled>In Progress</button>`;
      } else if(m.status==='ready'){
        statusLine = 'Objective complete!';
        btn = `<button data-action="turn-in-mission" data-id="${m.id}">Turn In — collect ${m.reward}g</button>`;
      } else {
        statusLine = 'Completed';
        btn = `<button class="owned" disabled>Done</button>`;
      }
      return `<div class="wcard ${m.status==='ready'?'equipped':''}" style="width:260px;">
        <h4>${m.title}</h4>
        <div class="stat">${m.desc}</div>
        <div class="stat" style="margin-top:6px;color:var(--amber)">${statusLine}</div>
        ${btn}
      </div>`;
    }
    const bountyCards = MISSIONS.filter(m=>m.type==='bounty' && !m.elite).map(missionCard).join('');
    const purgeCards = MISSIONS.filter(m=>m.type==='purge').map(missionCard).join('');
    const eliteCards = MISSIONS.filter(m=>m.elite).map(missionCard).join('');
    overlay.innerHTML = `
      <h1 style="font-size:32px">CONTRACT TENT</h1>
      <div class="statusrow"><span>⛁ <b>${gold}</b> gold</span><span>Contracts held: <b>${activeMissionCount()}/${MAX_ACTIVE_MISSIONS}</b></span></div>
      <div class="sectionLabel">Bounties — named targets hiding in the city</div>
      <div class="shopgrid">${bountyCards}</div>
      <div class="sectionLabel">Purges — clear the ruined villages</div>
      <div class="shopgrid">${purgeCards}</div>
      <div class="sectionLabel">Marked For Death — Elite Contracts</div>
      <div class="shopgrid">${eliteCards}</div>
      <button class="bigbtn" data-action="close-missions">Back To The Streets</button>
    `;
    overlay.style.display='flex';
  }

  overlay.addEventListener('click', (e)=>{
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.dataset.action;
    if(action==='begin'){ startGame(); }
    else if(action==='begin-with-password'){
      const input = document.getElementById('startPasswordBox');
      const msg = document.getElementById('startPasswordMsg');
      const state = parsePassword(input ? input.value : '');
      if(!state){
        if(msg){ msg.style.color = 'var(--blood-bright)'; msg.textContent = 'INVALID PASSWORD — CHECK AND TRY AGAIN'; }
        return;
      }
      applyPassword(state);
      startGame();
    }
    else if(action==='copy-password' || action==='copy-pause-password'){
      const isPause = action==='copy-pause-password';
      const box = document.getElementById(isPause ? 'pausePasswordBox' : 'deathPasswordBox');
      const msg = document.getElementById(isPause ? 'pauseCopyMsg' : 'deathCopyMsg');
      if(box){
        box.select();
        let copied = false;
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(box.value).then(()=>{
            if(msg) msg.textContent = 'COPIED TO CLIPBOARD';
          }).catch(()=>{
            if(msg) msg.textContent = 'COULD NOT COPY — TEXT IS SELECTED, USE CTRL/CMD+C';
          });
          copied = true;
        }
        if(!copied && msg) msg.textContent = 'TEXT SELECTED — USE CTRL/CMD+C TO COPY';
      }
    }
    else if(action==='retry-load'){ location.reload(); }
    else if(action==='enter-world'){ enterWorldAfterLoad(); }
    else if(action==='resume'){
      if(P.dead) return;
      phase='play';
      intentionalUnlock=false;
      const ok=requestMouseLock();
      if(!ok){ phase='paused'; renderPaused(); }
    }
    else if(action==='respawn'){ respawn(); }
    else if(action==='close-shop'){ closeShop(); }
    else if(action==='buy-weapon'){
      const w = WEAPONS.find(w=>w.id===el.dataset.id);
      if(w && gold>=w.cost && !ownedWeapons.has(w.id)){ gold -= w.cost; ownedWeapons.add(w.id); equipWeapon(w.id); document.getElementById('goldCount').textContent = gold; renderShop(); }
    }
    else if(action==='equip-weapon'){ equipWeapon(el.dataset.id); renderShop(); }
    else if(action==='buy-smoke'){
      if(gold>=SMOKE_BOMB_COST){ gold -= SMOKE_BOMB_COST; smokeBombs += SMOKE_BOMB_PACK; updateToolsHUD(); document.getElementById('goldCount').textContent = gold; renderShop(); }
    }
    else if(action==='buy-throwknife'){
      if(gold>=THROW_KNIFE_COST){ gold -= THROW_KNIFE_COST; throwingKnives += THROW_KNIFE_PACK; updateToolsHUD(); document.getElementById('goldCount').textContent = gold; renderShop(); }
    }
    else if(action==='buy-map'){
      if(gold>=MAP_COST && !ownedMap){ gold -= MAP_COST; ownedMap = true; document.getElementById('goldCount').textContent = gold; renderShop(); }
    }
    else if(action==='close-missions'){ closeMissions(); }
    else if(action==='accept-mission'){ acceptMission(el.dataset.id); renderMissions(); }
    else if(action==='turn-in-mission'){ turnInMission(el.dataset.id); renderMissions(); }
  });

  let worldBuilt = false;
  let worldInitQueue = [];
  let worldInitIndex = 0;
  let worldInitStarted = false;
  let worldInitError = null;

  function renderLoading(){
    const total = Math.max(1, worldInitQueue.length);
    const done = Math.min(worldInitIndex, total);
    const pct = Math.floor((done/total)*100);
    overlay.innerHTML = `
      <h1 style="font-size:30px">BUILDING THE WORLD</h1>
      <div class="sub">Preparing the city and villages</div>
      <div class="loadingSpinner"></div>
      <div class="controls">Please wait — building the city, villages, roads, towers, signs, and shoreline before you enter.</div>
      <div style="width:min(560px,80vw);height:16px;background:rgba(0,0,0,.55);border:1px solid rgba(232,220,200,.35);border-radius:4px;overflow:hidden;margin:10px 0 8px;">
        <div id="loadFill" style="width:${pct}%;height:100%;background:linear-gradient(90deg,#8a1f1f,#d68a3c);"></div>
      </div>
      <div id="loadText" style="font-size:12px;color:#cfc3ae;">${pct}% loaded</div>
    `;
    overlay.style.display='flex';
  }

  function renderReady(){
    overlay.innerHTML = `
      <h1 style="font-size:30px">CITY READY</h1>
      <div class="sub">The world is fully loaded</div>
      <div class="controls">Click below to enter. Your mouse will lock to the game screen.</div>
      <button class="bigbtn" data-action="enter-world">ENTER WORLD</button>
    `;
    overlay.style.display='flex';
  }

  function renderLoadError(err){
    const message = err && err.message ? err.message : String(err || 'Unknown world-building error');
    overlay.innerHTML = `
      <h1 style="font-size:30px">WORLD LOAD ERROR</h1>
      <div class="sub">The city could not finish building</div>
      <div class="controls">The game has been stopped so you are not released into a partially loaded world.</div>
      <div style="max-width:760px;margin:8px 0 16px;padding:10px 14px;background:rgba(120,20,20,.25);border:1px solid rgba(199,62,62,.5);border-radius:5px;font:12px/1.5 monospace;color:#e8dcc8;overflow:auto;max-height:120px;">${message.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}</div>
      <button class="bigbtn" data-action="retry-load">RETRY WORLD BUILD</button>
    `;
    overlay.style.display='flex';
  }

  function enterWorldAfterLoad(){
    if(phase!=='ready') return;
    intentionalUnlock=false;
    requestMouseLock();
  }

  function startGame(){
    if(worldInitStarted) return;
    worldInitStarted = true;
    worldTime = 0;
    dayNumber = 1;
    updateDayNight(0);
    phase='loading';
    document.getElementById('hud').style.display='none';

    player.position.set(SPAWN_POS.x,0,SPAWN_POS.z);
    yaw=0; pitch=0;
    applySwordVisual(currentWeapon);
    updateWeaponModeVisuals();
    updateAlertHUD();

    worldInitQueue = [
      ()=>buildOcean(),
      ()=>addWaterBarrier(),
      ()=>buildTownSquare(),
      ()=>buildMarketPlace(),
      ()=>buildShopStall(),
      ()=>buildMissionTent(),
      ()=>buildCity(),
      ...VILLAGES.map(v=>()=>{
        buildVillage(v);
        if(v.guardCount>0){
          buildVillageGuardTower(v);
          buildVillageWardenAltar(v);
        }
        const initial=Math.min(v.villagerTarget, v.fortified ? 18 : 7);
        for(let i=0;i<initial;i++) spawnVillageVillager(v);
        if(v.guardCount>0) ensureVillageGuards(v);
        villageTimers[v.id]={guardRefill:v.guardRefill,boss:v.bossInterval,alerted:false};
      }),
      ()=>buildVillageDirectionSigns(),
      ()=>buildVillagePaths(),
      ()=>buildRemoteWilderness(),
      ()=>{ for(let i=0;i<TARGET_PATROL_GUARDS;i++) spawnCityPatrolGuard(); }
    ];
    worldInitIndex=0;
    worldInitError=null;
    worldBuilt=true;
    renderLoading();
  }

  renderStart();




  // ================= VILLAGE PATHS =================
  function buildVillagePaths(){
    const pathMat=new THREE.MeshStandardMaterial({color:0x8a7355,roughness:.98});
    const edgeMat=new THREE.MeshStandardMaterial({color:0x6f5c45,roughness:1});

    function addPath(x1,z1,x2,z2,width=12){
      const dx=x2-x1, dz=z2-z1, distance=Math.hypot(dx,dz);
      const steps=Math.max(2,Math.ceil(distance/24));
      for(let i=0;i<steps;i++){
        const a=i/steps,b=(i+1)/steps;
        const ax=x1+dx*a,az=z1+dz*a,bx=x1+dx*b,bz=z1+dz*b;
        const mx=(ax+bx)/2,mz=(az+bz)/2;
        const len=Math.hypot(bx-ax,bz-az);
        const angle=Math.atan2(bx-ax,bz-az);

        const shoulder=new THREE.Mesh(
          new THREE.BoxGeometry(width+2,.035,len+2),edgeMat
        );
        shoulder.position.set(mx,.025,mz);
        shoulder.rotation.y=angle;
        scene.add(shoulder);

        const segment=new THREE.Mesh(
          new THREE.BoxGeometry(width,.08,len+1),pathMat
        );
        segment.position.set(mx,.045,mz);
        segment.rotation.y=angle;
        scene.add(segment);
      }
    }

    if(Array.isArray(VILLAGES)){
      VILLAGES.forEach(v=>{
        if(v && Number.isFinite(v.x) && Number.isFinite(v.z)){
          const dist = Math.hypot(v.x,v.z);
          const startDist = CITY_EXTENT + 30;
          const dirX = dist>0 ? v.x/dist : 0, dirZ = dist>0 ? v.z/dist : 0;
          addPath(dirX*startDist, dirZ*startDist, v.x, v.z, 12);
        }
      });
    }
  }

  // ================= REMOTE WILDERNESS =================
  // One-mile settlement exclusion: 100 world units = 1 mile.
  // Absolutely no wilderness trees/lakes are generated inside this radius
  // of the city or any village. Clear road corridors remain open.
  const SETTLEMENT_WILDERNESS_LIMIT = 100;
  // Extra buffer on top of the strict boundary so there's a clearly visible
  // gap between the treeline and any settlement wall or building, not just
  // a technical non-overlap.
  const SETTLEMENT_CLEARANCE = 25;

  function buildRemoteWilderness(){
    const settlementZones = VILLAGES.map(v=>({x:v.x,z:v.z,r:SETTLEMENT_WILDERNESS_LIMIT}));

    const roadCorridors = VILLAGES.map(v=>({x1:0,z1:0,x2:v.x,z2:v.z,width:16}));

    function outsideSettlements(x,z,extra=0){
      // The main city is a square grid of buildings (CITY_EXTENT half-width),
      // not a circle. A purely circular check centered on the origin lets
      // trees near a forest region's far corner (distance-wise, well past
      // the old 100-unit radius) land squarely inside the city's actual
      // square footprint. Check the city as a box, and villages (which are
      // small and roughly circular) as circles around their centers.
      // SETTLEMENT_CLEARANCE adds a wide visible buffer on top of that, so
      // the treeline sits clearly away from walls/buildings rather than
      // brushing right up against them.
      const buffer = extra + SETTLEMENT_CLEARANCE;
      if(Math.abs(x) < CITY_EXTENT+buffer && Math.abs(z) < CITY_EXTENT+buffer) return false;
      return settlementZones.every(s =>
        Math.hypot(x-s.x,z-s.z) >= s.r + buffer
      );
    }

    function outsideRoads(x,z,extra=0){
      return roadCorridors.every(p=>{
        const dx=p.x2-p.x1, dz=p.z2-p.z1;
        const len2=dx*dx+dz*dz;
        const t=Math.max(0,Math.min(1,
          ((x-p.x1)*dx+(z-p.z1)*dz)/len2
        ));
        const px=p.x1+t*dx, pz=p.z1+t*dz;
        return Math.hypot(x-px,z-pz) >= p.width+extra;
      });
    }

    // Visible roads: broad, gently segmented dirt paths connecting the city
    // directly to every village. They stay clear of wilderness generation.
    

    const trunkMat=new THREE.MeshStandardMaterial({color:0x573a25});
    const leafMats=[
      new THREE.MeshStandardMaterial({color:0x29482a}),
      new THREE.MeshStandardMaterial({color:0x356034}),
      new THREE.MeshStandardMaterial({color:0x203b25})
    ];

    // Water exclusion: trees must never spawn in the ocean or inside lakes.
    const lakeExclusionZones=[
      {x:-220,z:-220,rx:43,rz:33},
      {x:220,z:220,rx:39,rz:51}
    ];

    function onWater(x,z,margin=0){
      // Treat the far ocean edge as water. The playable land is kept inside
      // this boundary, with a generous buffer so trees cannot appear in it.
      const oceanLimit=1100-margin;
      if(Math.abs(x)>oceanLimit || Math.abs(z)>oceanLimit) return true;

      // The real ocean starts much closer in, just past the eastern shoreline
      // (same boundary as the water collision wall), and only runs along a
      // band roughly -210..210 in z. Without this check, wilderness forests
      // that dip into that band near the coast were seeding trees straight
      // into the sea, since only the far-away 1200 limit was being tested
      // above. Land north/south of the ocean band (villages, forests past
      // z=±210) is unaffected.
      if(x > WATER_WALL_X - margin && Math.abs(z) < 210 + margin) return true;

      return lakeExclusionZones.some(l=>{
        const nx=(x-l.x)/(l.rx+margin);
        const nz=(z-l.z)/(l.rz+margin);
        return nx*nx+nz*nz <= 1;
      });
    }

    function addForestTree(x,z,s){
      if(onWater(x,z,3)) return;
      const g=new THREE.Group();
      const trunk=new THREE.Mesh(
        new THREE.CylinderGeometry(.28*s,.42*s,3.2*s,7),trunkMat
      );
      trunk.position.y=1.6*s;
      g.add(trunk);

      const crown=new THREE.Mesh(
        new THREE.ConeGeometry(2*s,5*s,8),
        leafMats[Math.floor(Math.random()*leafMats.length)]
      );
      crown.position.y=4.8*s;
      g.add(crown);

      g.position.set(x,0,z);
      scene.add(g);
      obstacles.push({x,z,radius:1.3*s});
    }

    // Forest regions are deliberately beyond the one-mile ring.
    const forests=[
      {x:-195,z:-128,w:100,d:92},
      {x:195,z:128,w:100,d:92},
      {x:-212,z:212,w:92,d:82},
      {x:220,z:-212,w:92,d:82}
    ];

    forests.forEach(f=>{
      let n=0, tries=0;
      while(n<48 && tries<900){
        tries++;
        const x=f.x+(Math.random()-.5)*f.w;
        const z=f.z+(Math.random()-.5)*f.d;
        if(onWater(x,z,4)) continue;
        if(!outsideSettlements(x,z,3) || !outsideRoads(x,z,4)) continue;
        addForestTree(x,z,.75+Math.random()*.75);
        n++;
      }
    });

    // Lakes are also outside the one-mile settlement boundary and road corridors.
    const lakeMat=new THREE.MeshStandardMaterial({
      color:0x3f7180,transparent:true,opacity:.82,
      roughness:.2,metalness:.05
    });
    const bankMat=new THREE.MeshStandardMaterial({color:0x687353});

    [
      {x:-220,z:-220,rx:34,rz:25},
      {x:220,z:220,rx:31,rz:41}
    ].forEach(l=>{
      const safe=Math.max(l.rx,l.rz)+8;
      if(!outsideSettlements(l.x,l.z,safe) ||
         !outsideRoads(l.x,l.z,safe)) return;

      const bank=new THREE.Mesh(
        new THREE.CylinderGeometry(1,1,.16,48),bankMat
      );
      bank.scale.set(l.rx+5,1,l.rz+5);
      bank.position.set(l.x,.05,l.z);
      scene.add(bank);

      const water=new THREE.Mesh(
        new THREE.CylinderGeometry(1,1,.08,48),lakeMat
      );
      water.scale.set(l.rx,1,l.rz);
      water.position.set(l.x,.15,l.z);
      scene.add(water);
    });
  }

  // ================= MAIN LOOP =================
  // Performance optimization: expensive AI/DOM work runs at up to 30 Hz while
  // camera, movement, particles and rendering remain at full frame rate.
  let aiAccumulator = 0;
  let hudAccumulator = 0;
  const clock = new THREE.Clock();
  let popTimer = 0;
  let populationBacklog = 0;
  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(0.05, clock.getDelta());
    if(worldBuilt && worldInitIndex < worldInitQueue.length){
      try{
        const step = worldInitQueue[worldInitIndex++];
        step();
        const total=worldInitQueue.length;
        const pct=Math.floor((worldInitIndex/total)*100);
        const fill=document.getElementById('loadFill');
        const text=document.getElementById('loadText');
        if(fill) fill.style.width=pct+'%';
        if(text) text.textContent=pct+'% loaded';
      }catch(err){
        console.error('World build step failed:',err);
        worldInitError = err;
        worldBuilt = false;
        phase = 'load-error';
        renderLoadError(err);
      }
      if(!worldInitError && worldInitIndex>=worldInitQueue.length && phase==='loading'){
        const villageCiv=villagers.filter(v=>!v.isGuard&&!v.dead).length;
        populationBacklog=Math.max(0,TARGET_POP-villageCiv);
        MISSIONS.forEach(m=>{ if(m.type==='bounty' && m.status==='active') spawnBountyTarget(m); });
        updateMissionHUD();
        phase='ready';
        renderReady();
      }
    }
    if(phase==='play' && !P.dead){
      updateDayNight(dt);
      updateMovement(dt);
      updateWizardBoss(dt);
      aiAccumulator += dt;
      if(aiAccumulator >= 0.033){
        const aiDt = aiAccumulator; aiAccumulator = 0;
        updateVillagers(aiDt);
        updateKingBoss(aiDt);
        updateGrappledEnemies(aiDt);
        updatePoison(aiDt);
      }
      updateBossHealthHUD();
      updateGold(dt);
      updateSwing(dt);
      updateBowDraw(dt);
      updateHiding(dt);

      VILLAGES.forEach(v=>{
        const t=villageTimers[v.id];
        if(v.guardCount>0){
          t.guardRefill-=dt;
          if(t.guardRefill<=0){ t.guardRefill=v.guardRefill; ensureVillageGuards(v); }
          t.boss-=dt;
          if(t.boss<=0){ t.boss=v.bossInterval; spawnVillageWarden(v); }
        }
      });

      popTimer += dt;
      if(popTimer > 0.25){
        popTimer = 0;
        const civCount = villagers.filter(v=>!v.isGuard && !v.dead).length;
        const deficit = TARGET_POP - civCount;
        if(deficit > 0){
          const spawnCount = Math.min(4, deficit, populationBacklog || deficit);
          for(let i=0;i<spawnCount;i++) spawnCivilian();
          populationBacklog = Math.max(0, populationBacklog - spawnCount);
        }
        const patrolCount = villagers.filter(v=>v.isPatrolGuard && !v.dead).length;
        const patrolDeficit = TARGET_PATROL_GUARDS - patrolCount;
        if(patrolDeficit > 0){
          for(let i=0;i<Math.min(2,patrolDeficit);i++) spawnCityPatrolGuard();
        }
      }

      const anyGuardHunting = villagers.some(v=>v.isGuard && v.state==='attack' && !v.dead);
      if(alertLevel>0 && alertLevel<ALERT_HIGH && !anyGuardHunting){
        peaceTimer += dt;
        if(peaceTimer > 20){
          peaceTimer=0;
          alertLevel=Math.max(0,alertLevel-1);
          updateAlertHUD();
        }
      } else peaceTimer = 0;
    }
    updateParticles(dt);
    updateProjectiles(dt);
    updateEndingCamera(dt);
    updateHUD();
    updateMinimap(dt);
    renderer.render(scene, camera);
  }
  animate();
})();
</script>
</body>
